  <text class="mini" x="518" y="510">Outcome</text>
  <text class="mini" x="518" y="536">Constraints</text>
  <text class="mini" x="518" y="562">Participants</text>
  <text class="mini" x="518" y="588">Checkpoints</text>
  <path d="M454 496H488" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  <path d="M668 496H708" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>

  <rect x="708" y="304" width="748" height="486" rx="30" fill="#F9FCFB" stroke="#CDE5E0" stroke-width="2"/>
  <text class="card-title" x="742" y="348">Task breakdown canvas</text>
  <text class="mini" x="742" y="378">RT-OPS-CASE-01 / pilot launch / one-screen project frame</text>

  <rect x="742" y="408" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="768" y="444">Outcome</text>
  <text class="mini" x="768" y="478">Пилот проведен</text>
  <text class="mini" x="768" y="504">Есть midpoint signal</text>
  <text class="mini" x="768" y="530">Есть final review</text>

  <rect x="974" y="408" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="1000" y="444">Constraints</text>
  <text class="mini" x="1000" y="478">Окно: 2 недели</text>
  <text class="mini" x="1000" y="504">12 участников</text>
  <text class="mini" x="1000" y="530">Без перегруза команды</text>

  <rect x="1206" y="408" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="1232" y="444">Workstreams</text>
  <text class="mini" x="1232" y="478">Kickoff</text>
  <text class="mini" x="1232" y="504">Execution</text>
  <text class="mini" x="1232" y="530">Review</text>

  <rect x="742" y="574" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="768" y="610">Owners</text>
  <text class="mini" x="768" y="644">Общий owner пилота</text>
  <text class="mini" x="768" y="670">Владельцы блоков работ</text>

  <rect x="974" y="574" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="1000" y="610">Checkpoints</text>
  <text class="mini" x="1000" y="644">Kickoff</text>
  <text class="mini" x="1000" y="670">Midpoint-check</text>
  <text class="mini" x="1000" y="696">Final review</text>

  <rect x="1206" y="574" width="214" height="142" rx="22" fill="#FFFFFF" stroke="#D5E8E4" stroke-width="2"/>
  <text class="cap" x="1232" y="610">Risks</text>
  <text class="mini" x="1232" y="644">Параллельные инициативы</text>
  <text class="mini" x="1232" y="670">Размытые зоны владения</text>

  <text class="sub" x="92" y="818">Вывод: AI помогает собрать черновик управленческого разговора, но не принимает решение за человека.</text>
</svg>
