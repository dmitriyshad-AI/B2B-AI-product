<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .label { font-size: 21px; font-weight: 700; letter-spacing: 1px; fill: #0F766E; }
    .title { font-size: 42px; font-weight: 700; }
    .sub { font-size: 22px; fill: #576572; }
    .cap { font-size: 18px; font-weight: 700; fill: #0A5C56; }
    .card-title { font-size: 24px; font-weight: 700; }
    .body { font-size: 20px; fill: #34424F; }
    .mini { font-size: 17px; fill: #53616D; }
  </style>
  <rect width="1600" height="900" fill="#F4F0E7"/>
  <rect x="54" y="48" width="1492" height="804" rx="34" fill="#FFFDF8" stroke="#DDD6C9" stroke-width="2"/>
  <text class="label" x="92" y="98">R1 / TASK BREAKDOWN CANVAS</text>
  <text class="title" x="92" y="150">Сырой запрос еще не проект</text>
  <text class="sub" x="92" y="186">Нормальный запуск появляется только после явной пересборки задачи</text>

  <rect x="92" y="222" width="220" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="116" y="251">Outcome</text>
  <rect x="326" y="222" width="220" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="350" y="251">Constraints</text>
  <rect x="560" y="222" width="220" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="584" y="251">Workstreams</text>
  <rect x="794" y="222" width="190" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="818" y="251">Owners</text>
  <rect x="998" y="222" width="220" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="1022" y="251">Checkpoints</text>
  <rect x="1232" y="222" width="184" height="44" rx="22" fill="#DFF2EF"/>
  <text class="cap" x="1256" y="251">Risks</text>

  <rect x="92" y="304" width="360" height="486" rx="30" fill="#FFF7F4" stroke="#E7C9C0" stroke-width="2"/>
  <text class="card-title" x="126" y="356">Сырой вход</text>
  <text class="body" x="126" y="408">Нужно быстро запустить</text>
  <text class="body" x="126" y="438">внутренний пилот на 2 недели</text>
  <text class="body" x="126" y="484">В группе 12 человек</text>
  <text class="body" x="126" y="530">Нужны kickoff, midpoint-check</text>
  <text class="body" x="126" y="560">и final review</text>
  <text class="body" x="126" y="606">Команду нельзя перегрузить</text>
  <text class="mini" x="126" y="682">Проблема: нет outcome, владельца и точек контроля.</text>
  <text class="mini" x="126" y="714">Пока это пожелание, а не управляемый запуск.</text>

  <rect x="488" y="432" width="180" height="128" rx="28" fill="#E8F6F3" stroke="#B9DDD7" stroke-width="2"/>
