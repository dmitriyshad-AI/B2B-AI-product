<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 42px; font-weight: 700; }
    .sub { font-size: 22px; fill: #57636E; }
    .panelt { font-size: 28px; font-weight: 700; }
    .body { font-size: 20px; fill: #394651; }
  </style>
  <rect width="1600" height="900" fill="#F5FAF8"/>
  <text class="h" x="120" y="120">Одна встреча, два обязательных документа</text>
  <text class="sub" x="120" y="158">Если нет prep note и follow-up, разговор заканчивается без движения.</text>
  <rect x="120" y="220" width="430" height="480" rx="28" fill="#FFFFFF" stroke="#CFE3DD" stroke-width="2"/>
  <text class="panelt" x="160" y="276">До встречи / Prep note</text>
  <text class="body" x="160" y="340">- Context</text>
  <text class="body" x="160" y="386">- Tensions</text>
  <text class="body" x="160" y="432">- Questions</text>
  <text class="body" x="160" y="478">- Desired decisions</text>
  <rect x="640" y="360" width="320" height="160" rx="30" fill="#DFF2EF" stroke="#9CCBC2" stroke-width="2"/>
  <text class="panelt" x="722" y="440">Проблемный</text>
  <text class="panelt" x="750" y="478">созвон</text>
  <rect x="1050" y="220" width="430" height="480" rx="28" fill="#FFFFFF" stroke="#CFE3DD" stroke-width="2"/>
  <text class="panelt" x="1090" y="276">После встречи / Follow-up</text>
  <text class="body" x="1090" y="340">- Decisions</text>
  <text class="body" x="1090" y="386">- Owners</text>
  <text class="body" x="1090" y="432">- Deadlines</text>
  <text class="body" x="1090" y="478">- Unresolved issues</text>
  <text class="sub" x="120" y="784">Встреча превращается в управленческое движение в тот же день</text>
</svg>
