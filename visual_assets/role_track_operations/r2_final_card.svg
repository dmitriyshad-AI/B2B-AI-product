<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .q { font-size: 54px; font-weight: 700; }
    .s { font-size: 28px; fill: #53606C; }
    .hw { font-size: 26px; font-weight: 700; fill: #7C4C0A; }
  </style>
  <rect width="1600" height="900" fill="#FBF8F2"/>
  <rect x="120" y="120" width="1360" height="660" rx="34" fill="#FFFDF9" stroke="#E6DCCA" stroke-width="2"/>
  <text class="q" x="170" y="270">Хороший статус-апдейт не звучит солидно.</text>
  <text class="s" x="170" y="340">Он позволяет быстро понять состояние и сделать следующий шаг.</text>
  <rect x="170" y="450" width="1260" height="160" rx="24" fill="#FFF4DD" stroke="#E9D0A0" stroke-width="2"/>
  <text class="hw" x="210" y="520">Сразу после урока:</text>
  <text class="s" x="210" y="570">Возьмите ближайший weekly update и ужмите его до одного экрана</text>
  <text class="s" x="210" y="606">по рамке Progress / Risks / Slippage / Next steps / Attention needed.</text>
</svg>
