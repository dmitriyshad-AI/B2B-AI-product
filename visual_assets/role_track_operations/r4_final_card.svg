<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .q { font-size: 54px; font-weight: 700; }
    .s { font-size: 28px; fill: #53606C; }
    .hw { font-size: 26px; font-weight: 700; fill: #5F7B22; }
  </style>
  <rect width="1600" height="900" fill="#F8FBF2"/>
  <rect x="120" y="120" width="1360" height="660" rx="34" fill="#FFFDF9" stroke="#DCE3C9" stroke-width="2"/>
  <text class="q" x="170" y="250">Хороший результат работы с AI здесь — не готовое решение.</text>
  <text class="s" x="170" y="320">Это карта мышления, с которой уже можно спорить по-взрослому.</text>
  <rect x="170" y="450" width="1260" height="160" rx="24" fill="#F2F8E6" stroke="#D0E3A5" stroke-width="2"/>
  <text class="hw" x="210" y="520">Сразу после урока:</text>
  <text class="s" x="210" y="570">Возьмите одну рабочую дилемму и соберите memo на три варианта.</text>
</svg>
