<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .q { font-size: 54px; font-weight: 700; }
    .s { font-size: 28px; fill: #53606C; }
    .hw { font-size: 26px; font-weight: 700; fill: #0F6A63; }
  </style>
  <rect width="1600" height="900" fill="#F5FAF8"/>
  <rect x="120" y="120" width="1360" height="660" rx="34" fill="#FFFDF9" stroke="#D6E5E2" stroke-width="2"/>
  <text class="q" x="170" y="250">Люди не ненавидят встречи.</text>
  <text class="s" x="170" y="320">Они ненавидят встречи, после которых не появляется никакого управленческого движения.</text>
  <rect x="170" y="450" width="1260" height="160" rx="24" fill="#E8F6F3" stroke="#B9DDD7" stroke-width="2"/>
  <text class="hw" x="210" y="520">Сразу после урока:</text>
  <text class="s" x="210" y="570">Сделайте шаблон prep note и follow-up для одной типовой встречи.</text>
</svg>
