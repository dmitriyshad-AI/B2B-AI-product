<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 10</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Три первых шаблона в личной библиотеке</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">L10-TEMPLATE-SET-A переводит разовые находки в repeatable assets: follow-up, summary</tspan><tspan x="90" dy="34">документа и подготовку к встрече.</tspan></text><rect x="1198" y="70" width="312" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1220" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1220" dy="0">L10-TEMPLATE-SET-A</tspan></text><rect x="90" y="260" width="1420" height="426" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="210" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Шаблон</tspan></text><rect x="300" y="260" width="350" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="316" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="316" dy="0">Когда использовать</tspan></text><rect x="650" y="260" width="470" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="666" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="666" dy="0">Что даем на вход</tspan></text><rect x="1120" y="260" width="390" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="1136" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1136" dy="0">Что проверяем</tspan></text><rect x="90" y="330" width="210" height="126" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Follow-up после</tspan><tspan x="104" dy="22">встречи</tspan></text><rect x="300" y="330" width="350" height="126" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">После клиентского или</tspan><tspan x="314" dy="22">внутреннего созвона, когда</tspan><tspan x="314" dy="22">нужно быстро зафиксировать</tspan><tspan x="314" dy="22">договоренности.</tspan></text><rect x="650" y="330" width="470" height="126" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="664" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="664" dy="0">Адресат, что обсуждали, что решили,</tspan><tspan x="664" dy="22">следующий шаг, срок и нужный tone.</tspan></text><rect x="1120" y="330" width="390" height="126" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1134" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1134" dy="0">Сроки, конкретный next step и</tspan><tspan x="1134" dy="22">отсутствие новых обещаний.</tspan></text><rect x="90" y="456" width="210" height="126" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="490" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Summary документа</tspan></text><rect x="300" y="456" width="350" height="126" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="490" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">После чтения длинного</tspan><tspan x="314" dy="22">документа, инструкции или</tspan><tspan x="314" dy="22">заметок, когда нужно короткое</tspan><tspan x="314" dy="22">summary.</tspan></text><rect x="650" y="456" width="470" height="126" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="664" y="490" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="664" dy="0">Сам текст или выдержка, цель summary,</tspan><tspan x="664" dy="22">адресат и нужный формат: тезисы, риски,</tspan><tspan x="664" dy="22">actions.</tspan></text><rect x="1120" y="456" width="390" height="126" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="1134" y="490" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1134" dy="0">Цифры, ограничения и отсутствие</tspan><tspan x="1134" dy="22">широких выводов сверх текста.</tspan></text><rect x="90" y="582" width="210" height="104" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="616" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Подготовка к</tspan><tspan x="104" dy="22">встрече</tspan></text><rect x="300" y="582" width="350" height="104" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="616" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">Перед созвоном или встречей,</tspan><tspan x="314" dy="22">когда нужно быстро собрать</tspan><tspan x="314" dy="22">повестку и вопросы.</tspan></text><rect x="650" y="582" width="470" height="104" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="664" y="616" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="664" dy="0">Тема, участники, цель, риски и желаемый</tspan><tspan x="664" dy="22">результат встречи.</tspan></text><rect x="1120" y="582" width="390" height="104" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1134" y="616" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1134" dy="0">Нет ли лишних вопросов и</tspan><tspan x="1134" dy="22">соответствует ли глубина уровню</tspan><tspan x="1134" dy="22">участников.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l10_template_library_table</tspan></text></svg>