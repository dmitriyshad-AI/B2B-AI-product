<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 10</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Как личный шаблон превращается в</tspan><tspan x="90" dy="56">командный</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Мост нужен, чтобы показать переход от случайной удачи к общей библиотеке сценариев.</tspan></text><rect x="1198" y="70" width="312" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1220" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1220" dy="0">L10-TEMPLATE-SET-A</tspan></text><rect x="90" y="320" width="420" height="340" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="590" y="270" width="420" height="430" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><rect x="1090" y="320" width="420" height="340" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><line x1="510" y1="490" x2="570" y2="490" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><line x1="1010" y1="490" x2="1070" y2="490" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><text x="118" y="370" text-anchor="start" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Личный шаблон</tspan></text><text x="118" y="420" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Один удачный follow-up,</tspan><tspan x="118" dy="28">который вы сохранили для</tspan><tspan x="118" dy="28">себя. Полезен, но зависит от</tspan><tspan x="118" dy="28">памяти, стиля и привычек</tspan><tspan x="118" dy="28">одного человека.</tspan></text><text x="620" y="320" text-anchor="start" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="620" dy="0">Что добавляем</tspan></text><text x="1118" y="370" text-anchor="start" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1118" dy="0">Командный шаблон</tspan></text><text x="1118" y="420" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1118" dy="0">Повторяемый сценарий для</tspan><tspan x="1118" dy="28">нескольких сотрудников:</tspan><tspan x="1118" dy="28">общий вход, предсказуемый</tspan><tspan x="1118" dy="28">output и меньше хаоса в</tspan><tspan x="1118" dy="28">ежедневной работе.</tspan></text><circle cx="628" cy="374" r="6" fill="#6A56A5"/><text x="646" y="382" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="646" dy="0">Owner и понятное место</tspan><tspan x="646" dy="28">хранения</tspan></text><circle cx="628" cy="446" r="6" fill="#6A56A5"/><text x="646" y="454" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="646" dy="0">Единый формат входных</tspan><tspan x="646" dy="28">данных</tspan></text><circle cx="628" cy="518" r="6" fill="#6A56A5"/><text x="646" y="526" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="646" dy="0">Блок обязательной</tspan><tspan x="646" dy="28">проверки</tspan></text><circle cx="628" cy="590" r="6" fill="#6A56A5"/><text x="646" y="598" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="646" dy="0">Пример хорошего output</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="774" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Личная библиотека - первый слой. Командная библиотека начинается там, где сценарий</tspan><tspan x="120" dy="30">становится общим стандартом.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l10_personal_to_team_bridge</tspan></text></svg>