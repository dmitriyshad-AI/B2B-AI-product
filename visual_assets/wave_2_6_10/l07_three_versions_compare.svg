<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 7</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Одна новость, три версии сообщения</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Кейс L07-CASE-A показывает, как один базовый смысл адаптируется под коллегу, клиента</tspan><tspan x="90" dy="34">и руководителя.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L07-CASE-A</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="116" dy="0">Для коллеги</tspan></text><text x="116" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Коллеги, старт пилота</tspan><tspan x="116" dy="24">переносим на среду. IT</tspan><tspan x="116" dy="24">заканчивает доступы, поэтому</tspan><tspan x="116" dy="24">в понедельник просто потеряем</tspan><tspan x="116" dy="24">время на ручных обходах. До</tspan><tspan x="116" dy="24">завтра фиксируем список</tspan><tspan x="116" dy="24">участников и новый тайминг.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="596" dy="0">Для клиента</tspan></text><text x="596" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">Мария, коротко обновлю статус</tspan><tspan x="596" dy="24">по пилоту. Старт переносим на</tspan><tspan x="596" dy="24">среду, потому что команда</tspan><tspan x="596" dy="24">завершает настройку доступов.</tspan><tspan x="596" dy="24">Это позволит начать без</tspan><tspan x="596" dy="24">технических накладок. Завтра</tspan><tspan x="596" dy="24">до 15:00 пришлю тайминг</tspan><tspan x="596" dy="24">запуска.</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1076" dy="0">Для руководителя</tspan></text><text x="1076" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">Старт пилота сдвигаем с</tspan><tspan x="1076" dy="24">понедельника на среду.</tspan><tspan x="1076" dy="24">Причина - доступы еще не</tspan><tspan x="1076" dy="24">готовы. Риск управляемый, но</tspan><tspan x="1076" dy="24">важно не потерять доверие</tspan><tspan x="1076" dy="24">клиента. До 15:00 отправлю</tspan><tspan x="1076" dy="24">обновленный статус и</tspan><tspan x="1076" dy="24">следующий шаг.</tspan></text><rect x="90" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="114" dy="0">Коллега</tspan></text><text x="114" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">операционно и без лишнего</tspan><tspan x="114" dy="22">контекста</tspan></text><rect x="580" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="604" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="604" dy="0">Клиент</tspan></text><text x="604" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="604" dy="0">спокойно и с акцентом на</tspan><tspan x="604" dy="22">надежность</tspan></text><rect x="1070" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1094" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1094" dy="0">Руководитель</tspan></text><text x="1094" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1094" dy="0">риск, решение и короткий next step</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l07_three_versions_compare</tspan></text></svg>