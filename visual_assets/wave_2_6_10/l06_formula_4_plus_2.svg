<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 6</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Формула 4+2 на одном экране</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Четыре обязательные части убирают хаос; входные данные и ограничения подключаются по</tspan><tspan x="90" dy="34">ситуации.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L06-CASE-A</tspan></text><rect x="90" y="280" width="450" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="326" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="116" dy="0">1. Цель</tspan></text><text x="116" y="370" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Что должно случиться в конце:</tspan><tspan x="116" dy="26">зафиксировать договоренности и</tspan><tspan x="116" dy="26">следующий шаг.</tspan></text><rect x="575" y="280" width="450" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="601" y="326" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="601" dy="0">2. Контекст</tspan></text><text x="601" y="370" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="601" dy="0">Кто участвует, что уже решено,</tspan><tspan x="601" dy="26">какие сроки и условия важны</tspan><tspan x="601" dy="26">именно здесь.</tspan></text><rect x="1060" y="280" width="450" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="1086" y="326" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="1086" dy="0">3. Формат</tspan></text><text x="1086" y="370" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1086" dy="0">Письмо на 4-6 строк, short note,</tspan><tspan x="1086" dy="26">bullets или таблица - заранее</tspan><tspan x="1086" dy="26">задаем форму.</tspan></text><rect x="90" y="515" width="450" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="561" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="116" dy="0">4. Критерии качества</tspan></text><text x="116" y="605" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Деловой тон, без канцелярита,</tspan><tspan x="116" dy="26">один четкий next step, никакой</tspan><tspan x="116" dy="26">воды.</tspan></text><rect x="575" y="515" width="450" height="180" rx="28" fill="#EEF2F7" stroke="#D7D0C1" stroke-width="2"/><text x="601" y="561" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2C6A7A"><tspan x="601" dy="0">5. Входные данные</tspan></text><text x="601" y="605" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="601" dy="0">Заметки встречи, факты, цифры и</tspan><tspan x="601" dy="26">сроки, которые нельзя потерять.</tspan></text><rect x="1060" y="515" width="450" height="180" rx="28" fill="#F7EEE6" stroke="#D7D0C1" stroke-width="2"/><text x="1086" y="561" text-anchor="start" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="1086" dy="0">6. Ограничения</tspan></text><text x="1086" y="605" text-anchor="start" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1086" dy="0">Не обещать лишнего, не делать</tspan><tspan x="1086" dy="26">письмо слишком продающим и не</tspan><tspan x="1086" dy="26">придумывать факты.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="774" text-anchor="start" font-size="25" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">4 части обязательны почти всегда. Еще 2 подключаются по ситуации и страхуют от лишних</tspan><tspan x="120" dy="30">обещаний.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l06_formula_4_plus_2</tspan></text></svg>