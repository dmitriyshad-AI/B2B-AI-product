<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 9</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Три итерации одного weekly summary</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Кейс L09-CASE-A показывает, как ответ взрослеет: от общих слов к наблюдаемым фактам</tspan><tspan x="90" dy="34">и управленческому next step.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L09-CASE-A</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="116" dy="0">Итерация 1</tspan></text><text x="116" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Неделя пилота прошла успешно.</tspan><tspan x="116" dy="24">Участники активно</tspan><tspan x="116" dy="24">использовали AI и получили</tspan><tspan x="116" dy="24">полезный опыт. Есть потенциал</tspan><tspan x="116" dy="24">продолжить работу.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="596" dy="0">Итерация 2</tspan></text><text x="596" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">9 из 12 участников</tspan><tspan x="596" dy="24">использовали AI минимум 3</tspan><tspan x="596" dy="24">раза. Лучше всего сработали</tspan><tspan x="596" dy="24">follow-up письма. Риск -</tspan><tspan x="596" dy="24">summary длинных документов</tspan><tspan x="596" dy="24">без проверки.</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="324" text-anchor="start" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1076" dy="0">Итерация 3</tspan></text><text x="1076" y="372" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">9 из 12 участников</tspan><tspan x="1076" dy="24">использовали AI минимум 3</tspan><tspan x="1076" dy="24">раза. Самый устойчивый</tspan><tspan x="1076" dy="24">сценарий - follow-up после</tspan><tspan x="1076" dy="24">встреч. Следующий шаг:</tspan><tspan x="1076" dy="24">закрепить 3 шаблона и ввести</tspan><tspan x="1076" dy="24">чек-лист проверки.</tspan></text><rect x="90" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="114" dy="0">Итерация 1</tspan></text><text x="114" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">слишком общо и без управленческой</tspan><tspan x="114" dy="22">пользы</tspan></text><rect x="580" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="604" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="604" dy="0">Итерация 2</tspan></text><text x="604" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="604" dy="0">уже полезно, но критерии еще не</tspan><tspan x="604" dy="22">дожаты</tspan></text><rect x="1070" y="730" width="430" height="86" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1094" y="764" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1094" dy="0">Итерация 3</tspan></text><text x="1094" y="794" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1094" dy="0">рабочий черновик на основе</tspan><tspan x="1094" dy="22">наблюдаемых фактов</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l09_summary_iterations_compare</tspan></text></svg>