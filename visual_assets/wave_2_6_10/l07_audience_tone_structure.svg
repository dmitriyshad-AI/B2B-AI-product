<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 7</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Аудитория -&gt; Тон -&gt; Структура</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один базовый смысл меняется не по волшебству, а через адресата, глубину и следующий</tspan><tspan x="90" dy="34">шаг.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L07-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="316" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="210" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Адресат</tspan></text><rect x="300" y="260" width="240" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="316" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="316" dy="0">Тон</tspan></text><rect x="540" y="260" width="540" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="556" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="556" dy="0">Что подчеркиваем</tspan></text><rect x="1080" y="260" width="430" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="1096" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1096" dy="0">Следующий шаг</tspan></text><rect x="90" y="330" width="210" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Коллега</tspan></text><rect x="300" y="330" width="240" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">Прямо и операционно</tspan></text><rect x="540" y="330" width="540" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="554" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="554" dy="0">Старт сдвигается на 2 дня; в понедельник просто</tspan><tspan x="554" dy="22">потеряем время на ручных обходах.</tspan></text><rect x="1080" y="330" width="430" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1094" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1094" dy="0">До завтра фиксируем список участников</tspan><tspan x="1094" dy="22">и новый тайминг.</tspan></text><rect x="90" y="412" width="210" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Клиент</tspan></text><rect x="300" y="412" width="240" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">Спокойно и без</tspan><tspan x="314" dy="22">обвинений</tspan></text><rect x="540" y="412" width="540" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="554" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="554" dy="0">Перенос нужен, чтобы стартовать без технических</tspan><tspan x="554" dy="22">накладок и сохранить надежность запуска.</tspan></text><rect x="1080" y="412" width="430" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="1094" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1094" dy="0">Завтра до 15:00 отправляем</tspan><tspan x="1094" dy="22">подтвержденный тайминг запуска.</tspan></text><rect x="90" y="494" width="210" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Руководитель</tspan></text><rect x="300" y="494" width="240" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="314" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="314" dy="0">Коротко, с риском и</tspan><tspan x="314" dy="22">решением</tspan></text><rect x="540" y="494" width="540" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="554" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="554" dy="0">Причина в доступах; риск управляемый, но важно не</tspan><tspan x="554" dy="22">потерять доверие клиента.</tspan></text><rect x="1080" y="494" width="430" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1094" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1094" dy="0">До 15:00 даем обновленный статус и</tspan><tspan x="1094" dy="22">следующий управленческий шаг.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l07_audience_tone_structure</tspan></text></svg>