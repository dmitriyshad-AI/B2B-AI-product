<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 6</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Слабый запрос против рабочего запроса</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один и тот же кейс показывает, как формула 4+2 переводит письмо из случайного в</tspan><tspan x="90" dy="34">управляемый черновик.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L06-CASE-A</tspan></text><rect x="90" y="280" width="690" height="430" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="324" text-anchor="start" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="116" dy="0">Слабый запрос</tspan></text><text x="116" y="372" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Напиши письмо после встречи по пилоту. Неясно,</tspan><tspan x="116" dy="28">кому пишем, что уже обещано и какой следующий шаг</tspan><tspan x="116" dy="28">нужно зафиксировать.</tspan></text><rect x="820" y="280" width="690" height="430" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="846" y="324" text-anchor="start" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="846" dy="0">Рабочий запрос</tspan></text><text x="846" y="372" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="846" dy="0">Цель: зафиксировать договоренности. Контекст:</tspan><tspan x="846" dy="28">Мария, Илья, доступ до 18:00, 5 участников до</tspan><tspan x="846" dy="28">четверга, старт в понедельник. Формат: 4-6 строк.</tspan><tspan x="846" dy="28">Ограничения: без новых обещаний.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="774" text-anchor="start" font-size="25" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Сила не в секретном тексте, а в том, что модель перестает угадывать важные детали кейса.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l06_weak_vs_strong_followup</tspan></text></svg>