<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 8</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Checkpoint-вопросы по каждому этапу</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Эти проверки удерживают качество до того, как вы начнете собирать финальную</tspan><tspan x="90" dy="34">презентацию.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L08-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="480" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="250" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Этап</tspan></text><rect x="340" y="260" width="650" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="356" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="356" dy="0">Что спрашиваем</tspan></text><rect x="990" y="260" width="520" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="1006" y="304" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1006" dy="0">Зачем это нужно</tspan></text><rect x="90" y="330" width="250" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Цель и адресат</tspan></text><rect x="340" y="330" width="650" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">Какое решение должен принять руководитель после</tspan><tspan x="354" dy="22">презентации?</tspan></text><rect x="990" y="330" width="520" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="364" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">Отсекаем красивые, но бесполезные тезисы и</tspan><tspan x="1004" dy="22">держим управленческий фокус.</tspan></text><rect x="90" y="412" width="250" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Структура</tspan></text><rect x="340" y="412" width="650" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">Есть ли один смысл на слайд и отдельно ли показаны</tspan><tspan x="354" dy="22">результаты, риски и next step?</tspan></text><rect x="990" y="412" width="520" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="446" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">Не даем материалу слипнуться в общий рассказ</tspan><tspan x="1004" dy="22">без архитектуры.</tspan></text><rect x="90" y="494" width="250" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Наполнение</tspan></text><rect x="340" y="494" width="650" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">Есть ли наблюдаемые факты вместо общих слов и</tspan><tspan x="354" dy="22">самоуспокоения?</tspan></text><rect x="990" y="494" width="520" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="528" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">Слайды становятся decision-oriented, а не</tspan><tspan x="1004" dy="22">декларативными.</tspan></text><rect x="90" y="576" width="250" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="610" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Адаптация</tspan></text><rect x="340" y="576" width="650" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="610" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">Убраны ли детали, которые не нужны руководителю именно на</tspan><tspan x="354" dy="22">этом уровне?</tspan></text><rect x="990" y="576" width="520" height="82" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="610" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">Сохраняем краткость и не перегружаем человека</tspan><tspan x="1004" dy="22">лишними подробностями.</tspan></text><rect x="90" y="658" width="250" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="692" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Checkpoint</tspan></text><rect x="340" y="658" width="650" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="692" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">Понятен ли вывод, нет ли перегруза и ясен ли следующий шаг?</tspan></text><rect x="990" y="658" width="520" height="82" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="692" text-anchor="start" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">Ловим слабые места до финальной сборки и</tspan><tspan x="1004" dy="22">переделки всего deck.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l08_checkpoint_table</tspan></text></svg>