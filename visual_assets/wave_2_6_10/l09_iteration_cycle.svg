<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 9</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Итерационный цикл на одном экране</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Пятишаговый workflow показывает, как из слабого первого ответа сделать рабочий</tspan><tspan x="90" dy="34">черновик без магии.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L09-CASE-A</tspan></text><rect x="90" y="320" width="261" height="210" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="112" y="362" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="112" dy="0">Запрос</tspan></text><text x="112" y="406" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="112" dy="0">Ставим задачу и</tspan><tspan x="112" dy="24">заранее фиксируем</tspan><tspan x="112" dy="24">адресата и цель</tspan><tspan x="112" dy="24">summary.</tspan></text><line x1="357" y1="425" x2="369" y2="425" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="293" y="556" width="120" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="309" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="309" dy="0">что</tspan><tspan x="309" dy="18">убрать?</tspan></text><rect x="379" y="320" width="261" height="210" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="401" y="362" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="401" dy="0">Ответ</tspan></text><text x="401" y="406" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="401" dy="0">Получаем первый</tspan><tspan x="401" dy="24">черновик, а не</tspan><tspan x="401" dy="24">финальный verdict</tspan><tspan x="401" dy="24">по кейсу.</tspan></text><line x1="646" y1="425" x2="658" y2="425" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="582" y="556" width="120" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="598" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="598" dy="0">что</tspan><tspan x="598" dy="18">неясно?</tspan></text><rect x="668" y="320" width="261" height="210" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="690" y="362" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="690" dy="0">Оценка</tspan></text><text x="690" y="406" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="690" dy="0">Ищем общие слова,</tspan><tspan x="690" dy="24">шум, потерю фактов</tspan><tspan x="690" dy="24">и слабый next step.</tspan></text><line x1="935" y1="425" x2="947" y2="425" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="871" y="556" width="132" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="887" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="887" dy="0">что</tspan><tspan x="887" dy="18">уточнить?</tspan></text><rect x="957" y="320" width="261" height="210" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="979" y="362" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="979" dy="0">Уточнение</tspan></text><text x="979" y="406" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="979" dy="0">Добавляем критерии,</tspan><tspan x="979" dy="24">формат, точность и</tspan><tspan x="979" dy="24">ограничения по</tspan><tspan x="979" dy="24">tone.</tspan></text><line x1="1224" y1="425" x2="1236" y2="425" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="1160" y="556" width="164" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="1176" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1176" dy="0">можно</tspan><tspan x="1176" dy="18">отправлять?</tspan></text><rect x="1246" y="320" width="261" height="210" rx="28" fill="#EEF2F7" stroke="#D7D0C1" stroke-width="2"/><text x="1268" y="362" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2C6A7A"><tspan x="1268" dy="0">Проверка</tspan></text><text x="1268" y="406" text-anchor="start" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1268" dy="0">Оставляем только</tspan><tspan x="1268" dy="24">наблюдаемые факты и</tspan><tspan x="1268" dy="24">рабочий</tspan><tspan x="1268" dy="24">управленческий</tspan><tspan x="1268" dy="24">вывод.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="774" text-anchor="start" font-size="25" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Цикл короткий. Его задача - не усложнить работу, а снять дорогую переделку в самом конце.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l09_iteration_cycle</tspan></text></svg>