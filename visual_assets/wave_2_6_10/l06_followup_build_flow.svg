<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0,0 10,4 0,8" fill="#D7D0C1"/></marker></defs><rect width="1600" height="900" fill="#F6F1E8"/><circle cx="1480" cy="118" r="190" fill="#EEE5D4" opacity="0.45"/><circle cx="120" cy="804" r="170" fill="#EFE8DA" opacity="0.35"/><text x="90" y="90" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 6</tspan></text><text x="90" y="150" text-anchor="start" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Как собираем follow-up по кейсу</tspan><tspan x="90" dy="56">L06-CASE-A</tspan></text><text x="90" y="220" text-anchor="start" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Экран показывает путь от сырых заметок до финального письма, которое не обещает</tspan><tspan x="90" dy="34">лишнего.</tspan></text><rect x="1250" y="70" width="260" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1272" y="107" text-anchor="start" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1272" dy="0">L06-CASE-A</tspan></text><rect x="90" y="300" width="328" height="230" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="112" y="342" text-anchor="start" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="112" dy="0">Заметки встречи</tspan></text><text x="112" y="386" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="112" dy="0">Мария, Илья, доступ до</tspan><tspan x="112" dy="24">18:00, список 5</tspan><tspan x="112" dy="24">участников до четверга,</tspan><tspan x="112" dy="24">старт в понедельник.</tspan></text><line x1="424" y1="415" x2="444" y2="415" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="364" y="556" width="140" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="380" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="380" dy="0">факты на</tspan><tspan x="380" dy="18">месте</tspan></text><rect x="454" y="300" width="328" height="230" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="476" y="342" text-anchor="start" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="476" dy="0">Промпт 4+2</tspan></text><text x="476" y="386" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="476" dy="0">Цель, контекст, формат,</tspan><tspan x="476" dy="24">критерии плюс входные</tspan><tspan x="476" dy="24">данные и ограничения</tspan><tspan x="476" dy="24">кейса.</tspan></text><line x1="788" y1="415" x2="808" y2="415" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="728" y="556" width="140" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="744" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="744" dy="0">есть next</tspan><tspan x="744" dy="18">step</tspan></text><rect x="818" y="300" width="328" height="230" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="840" y="342" text-anchor="start" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="840" dy="0">AI-черновик</tspan></text><text x="840" y="386" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="840" dy="0">Сегодня до 18:00</tspan><tspan x="840" dy="24">отправлю доступ. До</tspan><tspan x="840" dy="24">четверга пришлите 5</tspan><tspan x="840" dy="24">участников.</tspan></text><line x1="1152" y1="415" x2="1172" y2="415" stroke="#D7D0C1" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="1092" y="556" width="170" height="34" rx="17" fill="#E9E1D3" stroke="#E9E1D3" stroke-width="1"/><text x="1108" y="579" text-anchor="start" font-size="16" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1108" dy="0">ничего не</tspan><tspan x="1108" dy="18">придумано</tspan></text><rect x="1182" y="300" width="328" height="230" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="1204" y="342" text-anchor="start" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1204" dy="0">Ручная проверка</tspan></text><text x="1204" y="386" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1204" dy="0">Подтверждаем сроки, tone</tspan><tspan x="1204" dy="24">и отсутствие новых</tspan><tspan x="1204" dy="24">обещаний перед отправкой</tspan><tspan x="1204" dy="24">письма.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="774" text-anchor="start" font-size="25" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Ограничения нужны не для красоты: они не дают модели пообещать лишнее в follow-up письме.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 2 production pack</tspan></text><text x="1130" y="855" text-anchor="start" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1130" dy="0">l06_followup_build_flow</tspan></text></svg>