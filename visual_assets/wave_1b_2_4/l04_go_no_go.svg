<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 4</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Go / No-Go filter на одном экране</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">У ученика должен остаться короткий экран, по которому он сможет отсеять плохие</tspan><tspan x="90" dy="34">стартовые кейсы без наставника.</tspan></text><rect x="1270" y="70" width="240" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1294" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1294" dy="0">CM-L04-MATRIX-A</tspan></text><rect x="90" y="280" width="690" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">1. Повторяется</tspan></text><text x="118" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Если задача редкая, на ней трудно</tspan><tspan x="118" dy="28">закрепить навык и увидеть системную</tspan><tspan x="118" dy="28">пользу.</tspan></text><rect x="820" y="280" width="690" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="848" dy="0">2. Результат понятен</tspan></text><text x="848" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Вы должны быстро понимать, что считать</tspan><tspan x="848" dy="28">хорошим выходом и что именно проверять.</tspan></text><rect x="90" y="520" width="690" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="118" dy="0">3. Риск умеренный</tspan></text><text x="118" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Ошибка не должна сразу бить по деньгам,</tspan><tspan x="118" dy="28">репутации или чувствительным данным.</tspan></text><rect x="820" y="520" width="690" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">4. Польза ощутима</tspan></text><text x="848" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Если ускорение не чувствуется, сценарий не</tspan><tspan x="848" dy="28">даст ранней мотивации и первая практическая победа.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l04_go_no_go</tspan></text></svg>