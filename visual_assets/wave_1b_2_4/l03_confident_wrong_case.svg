<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 3</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Гладкий ответ с высокой ценой ошибки</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Опасность начинается там, где модель звучит убедительно, но обещает то, что не</tspan><tspan x="90" dy="34">подтверждено.</tspan></text><rect x="1270" y="70" width="240" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1294" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1294" dy="0">CM-L03-CASE-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Что реально известно</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="890" dy="0">Что опасно пишет AI</tspan></text><text x="120" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">Запуск не подтвержден. DPA не</tspan><tspan x="120" dy="30">согласован. Два магазина не передали</tspan><tspan x="120" dy="30">таблицы. Клиент просит письменный</tspan><tspan x="120" dy="30">статус.</tspan></text><text x="890" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">“Запуск в понедельник подтвержден,</tspan><tspan x="890" dy="30">критических рисков нет, можно спокойно</tspan><tspan x="890" dy="30">идти в старт”. Гладко, но ложно.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Чем убедительнее звучит ошибка, тем легче перенести ее в письмо, решение или обещание</tspan><tspan x="120" dy="30">клиенту.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l03_confident_wrong_case</tspan></text></svg>