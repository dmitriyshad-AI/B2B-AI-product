<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 4</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Хороший и плохой первый сценарий</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Нужно показать не просто матрицу, а контраст между разумным и опасным стартом.</tspan></text><rect x="1270" y="70" width="240" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1294" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1294" dy="0">CM-L04-MATRIX-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Хороший старт</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="890" dy="0">Плохой старт</tspan></text><text x="120" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">Summary длинного документа: задача</tspan><tspan x="120" dy="30">повторяется, хороший результат</tspan><tspan x="120" dy="30">понятен, риск умеренный, польза</tspan><tspan x="120" dy="30">ощущается сразу.</tspan></text><text x="890" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">Письмо клиенту с обещанием скидки или</tspan><tspan x="890" dy="30">срока: ошибка дорога, сценарий</tspan><tspan x="890" dy="30">чувствительный, для старта это не</tspan><tspan x="890" dy="30">учебный кейс.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Стартуйте не с самой умной задачи, а с той, которая быстро дает пользу и не ломает вам</tspan><tspan x="120" dy="30">работу.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l04_good_vs_bad_start</tspan></text></svg>