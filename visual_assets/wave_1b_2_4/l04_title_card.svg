<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="90" y="90" width="1420" height="720" rx="40" fill="#FBF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="120" y="120" width="260" height="52" rx="26" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="144" y="154" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="144" dy="0">Урок 4</tspan></text><text x="120" y="250" font-size="58" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="120" dy="0">Как выбрать первые сценарии для</tspan><tspan x="120" dy="66">AI</tspan></text><text x="120" y="360" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="120" dy="0">Старт курса ломается не на отсутствии сценариев, а на выборе слишком</tspan><tspan x="120" dy="36">сложного или опасного первого кейса.</tspan></text><rect x="120" y="460" width="1360" height="180" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="160" y="530" font-size="34" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="160" dy="0">Первый сценарий должен пройти фильтр частоты,</tspan><tspan x="160" dy="42">понятности, риска и пользы.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l04_title_card</tspan></text></svg>