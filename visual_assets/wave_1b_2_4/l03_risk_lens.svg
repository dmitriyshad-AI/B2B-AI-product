<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 3</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Четыре линзы риска</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Риск нужно объяснять не эмоциями, а повторяемой рамкой проверки.</tspan></text><rect x="1270" y="70" width="240" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1294" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1294" dy="0">CM-L03-CASE-A</tspan></text><rect x="90" y="280" width="690" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Факты</tspan></text><text x="118" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Есть ли здесь даты, числа, статусы или</tspan><tspan x="118" dy="28">условия, которые модель могла исказить?</tspan></text><rect x="820" y="280" width="690" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="848" dy="0">Контекст</tspan></text><text x="848" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Модель реально знает бизнес-контекст или</tspan><tspan x="848" dy="28">просто достраивает его правдоподобно?</tspan></text><rect x="90" y="520" width="690" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="118" dy="0">Цена ошибки</tspan></text><text x="118" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Это внутренний черновик или внешнее</tspan><tspan x="118" dy="28">сообщение, от которого зависит доверие и</tspan><tspan x="118" dy="28">деньги?</tspan></text><rect x="820" y="520" width="690" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">Чувствительность</tspan></text><text x="848" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Не загрузили ли мы лишние данные, которые</tspan><tspan x="848" dy="28">вообще не стоило отправлять в модель?</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l03_risk_lens</tspan></text></svg>