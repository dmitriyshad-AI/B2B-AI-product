<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 2</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Три первых сценария без перегруза</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">На старте нужно видеть не теорию, а три быстрых примера пользы.</tspan></text><rect x="1270" y="70" width="240" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1294" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1294" dy="0">CM-L02-TASK-MAP-A</tspan></text><rect x="90" y="280" width="690" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Summary документа</tspan></text><text x="118" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">AI быстро вытаскивает суть, риски и action</tspan><tspan x="118" dy="28">items из длинных заметок.</tspan></text><rect x="820" y="280" width="690" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="848" dy="0">Структура документа</tspan></text><text x="848" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">AI помогает перейти от пустого листа к</tspan><tspan x="848" dy="28">рабочему skeleton для записки или</tspan><tspan x="848" dy="28">презентации.</tspan></text><rect x="90" y="520" width="690" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="118" dy="0">Подготовка к встрече</tspan></text><text x="118" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">AI собирает повестку, вопросы и следующий</tspan><tspan x="118" dy="28">шаг для weekly sync.</tspan></text><rect x="820" y="520" width="690" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">Стартовый фильтр</tspan></text><text x="848" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Берите только то, что повторяется, понятно</tspan><tspan x="848" dy="28">проверяется и не несет высокой цены</tspan><tspan x="848" dy="28">ошибки.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · Wave 1B</tspan></text><text x="1140" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1140" dy="0">l02_three_examples</tspan></text></svg>