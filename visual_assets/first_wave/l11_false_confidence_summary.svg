<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 11</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Когда гладкий язык маскирует ошибку</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Этот экран нужен, чтобы на видео было видно: опасность рождается не из явной</tspan><tspan x="90" dy="34">ерунды, а из правдоподобного и уверенного тона.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L11-CASE-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Что говорят исходные заметки</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="890" dy="0">Что уверенно выдает AI</tspan></text><text x="120" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">214 лидов против 182. Конверсия в демо</tspan><tspan x="120" dy="30">снизилась с 34% до 31%. Узкие места:</tspan><tspan x="120" dy="30">юристы и слабый follow-up.</tspan></text><text x="890" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">“Конверсия выросла до 31%, главным</tspan><tspan x="890" dy="30">драйвером стал быстрый юридический</tspan><tspan x="890" dy="30">процесс, узких мест почти нет”. Тон</tspan><tspan x="890" dy="30">гладкий, выводы ошибочны.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Ловушка урока: чем убедительнее звучит ошибка, тем выше риск перенести ее в письмо,</tspan><tspan x="120" dy="30">записку или презентацию.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l11_false_confidence_summary</tspan></text></svg>