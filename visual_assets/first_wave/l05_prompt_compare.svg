<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 5</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Слабый запрос против сильного запроса</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один и тот же кейс показывает: проблема часто не в модели, а в расплывчатой</tspan><tspan x="90" dy="34">постановке задачи.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L05-CASE-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Слабый запрос</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="890" dy="0">Сильный запрос</tspan></text><text x="120" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">“Напиши хорошее письмо клиенту после</tspan><tspan x="120" dy="30">встречи”. Нет цели, нет контекста, нет</tspan><tspan x="120" dy="30">формата и нет критериев качества.</tspan></text><text x="890" y="380" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">Есть адресат, сценарий, сроки,</tspan><tspan x="890" dy="30">ожидаемое действие и ограничение по</tspan><tspan x="890" dy="30">тону. Модель работает внутри понятной</tspan><tspan x="890" dy="30">рамки.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Качество ответа начинается с качества постановки задачи.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l05_prompt_compare</tspan></text></svg>