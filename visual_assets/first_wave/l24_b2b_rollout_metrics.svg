<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 24</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">B2B mini-rollout и три метрики</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Этот экран нужен для разговора с ЛПР: что именно показывать через 14 дней, чтобы</tspan><tspan x="90" dy="34">обучение не осталось ощущением.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L24-CASE-B</tspan></text><rect x="90" y="270" width="850" height="460" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="980" y="270" width="530" height="460" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="320" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Mini-rollout artifact</tspan></text><text x="120" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">Команда из 5 аккаунт-менеджеров берет один общий</tspan><tspan x="120" dy="28">сценарий: follow-up после клиентских созвонов. Owner</tspan><tspan x="120" dy="28">— team lead. Через 14 дней команда приносит 1 общий</tspan><tspan x="120" dy="28">шаблон, 3 реальных примера писем и короткий отчет по</tspan><tspan x="120" dy="28">применению.</tspan></text><text x="1010" y="320" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1010" dy="0">Что показываем ЛПР</tspan></text><rect x="1010" y="352" width="470" height="88" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1034" y="384" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1034" dy="0">Метрика 1</tspan></text><text x="1034" y="416" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1034" dy="0">доля follow-up писем, отправленных в</tspan><tspan x="1034" dy="24">течение 30 минут после встречи</tspan></text><rect x="1010" y="456" width="470" height="88" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1034" y="488" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1034" dy="0">Метрика 2</tspan></text><text x="1034" y="520" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1034" dy="0">среднее время на подготовку первого</tspan><tspan x="1034" dy="24">черновика</tspan></text><rect x="1010" y="560" width="470" height="88" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1034" y="592" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1034" dy="0">Метрика 3</tspan></text><text x="1034" y="624" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1034" dy="0">число писем, где команда</tspan><tspan x="1034" dy="24">использовала общий шаблон</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l24_b2b_rollout_metrics</tspan></text></svg>