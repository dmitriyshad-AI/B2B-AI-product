<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 11</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Разбор ошибки по слоям</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один экран для проговаривания трех типов ложной уверенности: сдвиг факта, лишний</tspan><tspan x="90" dy="34">вывод и потеря контекста.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L11-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="500" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="310" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Тип ошибки</tspan></text><rect x="400" y="260" width="560" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="416" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="416" dy="0">Что произошло</tspan></text><rect x="960" y="260" width="550" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="976" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="976" dy="0">Чем это опасно</tspan></text><rect x="90" y="330" width="310" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="366" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Сдвиг факта</tspan></text><rect x="400" y="330" width="560" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="366" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">31% ниже 34%, но AI подает это как рост</tspan><tspan x="414" dy="22">конверсии.</tspan></text><rect x="960" y="330" width="550" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="974" y="366" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="974" dy="0">Руководитель видит несуществующее улучшение</tspan><tspan x="974" dy="22">воронки.</tspan></text><rect x="90" y="388" width="310" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="424" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Лишний вывод</tspan></text><rect x="400" y="388" width="560" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="424" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">Юристы и follow-up были проблемой, а модель</tspan><tspan x="414" dy="22">называет их драйвером роста.</tspan></text><rect x="960" y="388" width="550" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="974" y="424" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="974" dy="0">Команда может закрепить неверное решение.</tspan></text><rect x="90" y="446" width="310" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="482" font-size="19" 