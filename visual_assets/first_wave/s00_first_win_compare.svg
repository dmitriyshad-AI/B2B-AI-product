<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Сессия 0</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">First Win: от baseline к рабочему</tspan><tspan x="90" dy="56">черновику</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один и тот же кейс показывает не магию, а ускорение старта и рост ясности уже в</tspan><tspan x="90" dy="34">первые 10 минут.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-S00-L01-CASE-A</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#F8F1E8" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="116" dy="0">Baseline без AI</tspan></text><text x="116" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Спасибо за встречу. Пришлем</tspan><tspan x="116" dy="28">доступ и потом созвонимся.</tspan><tspan x="116" dy="28">Направьте список участников.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="596" dy="0">AI-черновик</tspan></text><text x="596" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">Сегодня до 18:00 отправлю</tspan><tspan x="596" dy="28">демо. Пришлите 3 email</tspan><tspan x="596" dy="28">участников до пятницы. Созвон</tspan><tspan x="596" dy="28">подтверждаю: вторник, 11:00.</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="1076" dy="0">Финальная версия</tspan></text><text x="1076" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">Короткое письмо с четким</tspan><tspan x="1076" dy="28">сроком, понятным действием и</tspan><tspan x="1076" dy="28">спокойным деловым тоном.</tspan></text><rect x="90" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="114" dy="0">Польза</tspan></text><text x="114" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">быстрее начать и не забыть</tspan><tspan x="114" dy="28">следующий шаг</tspan></text><rect x="445" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="469" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="469" dy="0">Проверка</tspan></text><text x="469" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="469" dy="0">тон и факт встречи все равно</tspan><tspan x="469" dy="28">подтверждает человек</tspan></text><rect x="800" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="824" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="824" dy="0">Артефакт</tspan></text><text x="824" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="824" dy="0">baseline, AI-draft и final</tspan><tspan x="824" dy="28">draft сохраняются в LMS</tspan></text><rect x="1155" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1179" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1179" dy="0">Первый win</tspan></text><text x="1179" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1179" dy="0">курс дает пользу сразу, до</tspan><tspan x="1179" dy="28">длинной теории</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">s00_first_win_compare</tspan></text></svg>