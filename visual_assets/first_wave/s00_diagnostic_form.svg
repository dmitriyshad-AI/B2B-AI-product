<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Сессия 0</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Входная самодиагностика</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один экран для старта: роль, частота использования AI, рабочие задачи и критерий</tspan><tspan x="90" dy="34">успеха на 14 дней.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-S00-L01-CASE-A</tspan></text><rect x="90" y="280" width="650" height="470" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="328" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="118" dy="0">Что спрашиваем до старта</tspan></text><circle cx="125" cy="367" r="6" fill="#C65A1E"/><text x="145" y="375" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="145" dy="0">Роль и текущий уровень</tspan><tspan x="145" dy="30">использования AI.</tspan></text><circle cx="125" cy="437" r="6" fill="#C65A1E"/><text x="145" y="445" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="145" dy="0">Какие задачи уже пробовали</tspan><tspan x="145" dy="30">ускорять.</tspan></text><circle cx="125" cy="507" r="6" fill="#C65A1E"/><text x="145" y="515" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="145" dy="0">Где чувствуется уверенность.</tspan></text><circle cx="125" cy="577" r="6" fill="#C65A1E"/><text x="145" y="585" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="145" dy="0">Где есть риск, барьер или</tspan><tspan x="145" dy="30">недоверие.</tspan></text><rect x="860" y="280" width="650" height="470" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="888" y="328" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="888" dy="0">Что фиксируем как стартовую точку</tspan></text><circle cx="895" cy="367" r="6" fill="#C65A1E"/><text x="915" y="375" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="915" dy="0">Три задачи, которые хочется</tspan><tspan x="915" dy="30">ускорить в первую очередь.</tspan></text><circle cx="895" cy="437" r="6" fill="#C65A1E"/><text x="915" y="445" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="915" dy="0">Ожидаемый результат через 14 дней.</tspan></text><circle cx="895" cy="507" r="6" fill="#C65A1E"/><text x="915" y="515" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="915" dy="0">Где человек теряет время прямо</tspan><tspan x="915" dy="30">сейчас.</tspan></text><circle cx="895" cy="577" r="6" fill="#C65A1E"/><text x="915" y="585" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="915" dy="0">С каким страхом или сомнением идет</tspan><tspan x="915" dy="30">в курс.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">s00_diagnostic_form</tspan></text></svg>