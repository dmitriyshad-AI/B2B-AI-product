<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 5</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Формула хорошего запроса на одном</tspan><tspan x="90" dy="56">экране</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Четыре опоры нужны не для красоты, а чтобы AI перестал угадывать вслепую.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L05-CASE-A</tspan></text><rect x="90" y="280" width="690" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">1. Цель</tspan></text><text x="118" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Что должно получиться в конце: письмо,</tspan><tspan x="118" dy="28">summary, note, список решений.</tspan></text><rect x="820" y="280" width="690" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="848" dy="0">2. Контекст</tspan></text><text x="848" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Кто адресат, что уже произошло, какие</tspan><tspan x="848" dy="28">сроки и ограничения важны именно здесь.</tspan></text><rect x="90" y="520" width="690" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="118" dy="0">3. Формат</tspan></text><text x="118" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Сколько строк, какой тип ответа, какая</tspan><tspan x="118" dy="28">структура, нужен ли список или письмо.</tspan></text><rect x="820" y="520" width="690" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">4. Критерий качества</tspan></text><text x="848" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Что делает ответ пригодным: краткость,</tspan><tspan x="848" dy="28">тон, следующий шаг, ясность, отсутствие</tspan><tspan x="848" dy="28">лишнего.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l05_prompt_formula</tspan></text></svg>