<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 16</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Четыре опоры качественной переписки</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Этот экран должен стоять в начале блока, чтобы потом все демо читались через одну</tspan><tspan x="90" dy="34">рабочую рамку.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L16-CASE-A</tspan></text><rect x="90" y="280" width="690" height="180" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Кому пишем</tspan></text><text x="118" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Роль адресата и уровень близости: клиент,</tspan><tspan x="118" dy="28">коллега, руководитель, партнер.</tspan></text><rect x="820" y="280" width="690" height="180" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="332" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="848" dy="0">Зачем пишем</tspan></text><text x="848" y="372" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Подтвердить договоренности, напомнить о</tspan><tspan x="848" dy="28">действии, согласовать решение, попросить</tspan><tspan x="848" dy="28">данные.</tspan></text><rect x="90" y="520" width="690" height="180" rx="28" fill="#F7F5FD" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="118" dy="0">Какое действие ждем</tspan></text><text x="118" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Прислать email, подтвердить слот,</tspan><tspan x="118" dy="28">отправить документы, дать комментарий,</tspan><tspan x="118" dy="28">согласовать текст.</tspan></text><rect x="820" y="520" width="690" height="180" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="572" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">Какой тон допустим</tspan></text><text x="848" y="612" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Короткий, деловой, спокойный, без</tspan><tspan x="848" dy="28">канцелярита и без искусственной</tspan><tspan x="848" dy="28">идеальности.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l16_four_anchors</tspan></text></svg>