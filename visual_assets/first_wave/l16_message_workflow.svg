<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 16</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">AI как черновик и как редактор</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Два режима на одном экране: кейс A показывает письмо с нуля, кейс B — улучшение</tspan><tspan x="90" dy="34">уже написанного сообщения.</tspan></text><rect x="1280" y="70" width="230" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1304" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1304" dy="0">FW-L16-CASE-A / FW-L16-CASE-B</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#F8F1E8" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="116" dy="0">Кейс A · с нуля</tspan></text><text x="116" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Follow-up после встречи: AI</tspan><tspan x="116" dy="28">собирает первый черновик,</tspan><tspan x="116" dy="28">человек сокращает и делает</tspan><tspan x="116" dy="28">следующий шаг конкретным.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="596" dy="0">Кейс B · из сырого текста</tspan></text><text x="596" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">Напоминание о документах: AI</tspan><tspan x="596" dy="28">не пишет «лучше человека», а</tspan><tspan x="596" dy="28">помогает сделать текст яснее</tspan><tspan x="596" dy="28">и спокойнее.</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#FFF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="1076" dy="0">Главное правило</tspan></text><text x="1076" y="370" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">AI полезен как черновик и</tspan><tspan x="1076" dy="28">редактор. Ответственность за</tspan><tspan x="1076" dy="28">тон, уместность и точность</tspan><tspan x="1076" dy="28">остается у человека.</tspan></text><rect x="90" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="114" dy="0">Режим 1</tspan></text><text x="114" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">сбор письма после встречи</tspan></text><rect x="445" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="469" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="469" dy="0">Режим 2</tspan></text><text x="469" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="469" dy="0">редактура слабого сообщения</tspan></text><rect x="800" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="824" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="824" dy="0">Проверяем</tspan></text><text x="824" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="824" dy="0">ясность действия и</tspan><tspan x="824" dy="28">естественность тона</tspan></text><rect x="1155" y="730" width="330" height="120" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1179" y="770" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1179" dy="0">Результат</tspan></text><text x="1179" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1179" dy="0">2 шаблона для типовой</tspan><tspan x="1179" dy="28">переписки</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Business-learning visual asset · First wave production pack</tspan></text><text x="1110" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1110" dy="0">l16_message_workflow</tspan></text></svg>