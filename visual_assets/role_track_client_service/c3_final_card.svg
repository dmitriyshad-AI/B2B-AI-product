<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 44px; font-weight: 700; }
    .sub { font-size: 24px; fill: #56626D; }
  </style>
  <rect width="1600" height="900" fill="#F4F9FF"/>
  <text class="h" x="120" y="270">Сразу после урока</text>
  <text class="sub" x="120" y="340">Перепишите один реальный первый ответ по новой структуре.</text>
  <text class="sub" x="120" y="390">Клиенту нужен понятный следующий шаг, а не длинное оправдание.</text>
</svg>
