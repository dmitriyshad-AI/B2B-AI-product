<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #2A5E97; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#F4F9FF"/>
  <text class="h" x="120" y="110">Карта triage и приоритета обращения</text>
  <text class="sub" x="120" y="150">Сразу видно срочность, ожидание клиента и следующий шаг.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#CFE0F3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#E7F1FC"/>
  <text class="th" x="162" y="288">Что случилось</text>
  <text class="th" x="410" y="288">Срочность</text>
  <text class="th" x="620" y="288">Кого затронуло</text>
  <text class="th" x="875" y="288">Ожидание клиента</text>
  <text class="th" x="1140" y="288">Владелец</text>
  <text class="th" x="1340" y="288">Следующий шаг</text>
  <line x1="261" y1="250" x2="261" y2="710" stroke="#CFE0F3"/>
  <line x1="490" y1="250" x2="490" y2="710" stroke="#CFE0F3"/>
  <line x1="722" y1="250" x2="722" y2="710" stroke="#CFE0F3"/>
  <line x1="982" y1="250" x2="982" y2="710" stroke="#CFE0F3"/>
  <line x1="1215" y1="250" x2="1215" y2="710" stroke="#CFE0F3"/>
  <text class="td" x="162" y="370">Какой симптом пришел</text>
  <text class="td" x="410" y="370">Насколько это срочно</text>
  <text class="td" x="620" y="370">Кто пострадал</text>
  <text class="td" x="875" y="370">Что клиент ждет сейчас</text>
  <text class="td" x="1140" y="370">Кто берет в работу</text>
  <text class="td" x="1340" y="370">Что делаем первым</text>
</svg>
