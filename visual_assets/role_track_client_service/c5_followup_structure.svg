<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #2A5E97; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#F4F9FF"/>
  <text class="h" x="120" y="110">Структура сервисного follow-up</text>
  <text class="sub" x="120" y="150">Клиент должен видеть статус, ожидание и момент следующего возврата.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#CFE0F3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#E7F1FC"/>
  <text class="th" x="162" y="288">Статус</text>
  <text class="th" x="430" y="288">Что сделали</text>
  <text class="th" x="700" y="288">Что ждем</text>
  <text class="th" x="980" y="288">Когда вернемся</text>
  <text class="th" x="1250" y="288">Что важно клиенту</text>
  <line x1="271" y1="250" x2="271" y2="710" stroke="#CFE0F3"/>
  <line x1="540" y1="250" x2="540" y2="710" stroke="#CFE0F3"/>
  <line x1="815" y1="250" x2="815" y2="710" stroke="#CFE0F3"/>
  <line x1="1090" y1="250" x2="1090" y2="710" stroke="#CFE0F3"/>
  <text class="td" x="162" y="370">На чем сейчас стоим</text>
  <text class="td" x="430" y="370">Что уже предприняли</text>
  <text class="td" x="700" y="370">Что мешает закрыть вопрос</text>
  <text class="td" x="980" y="370">Когда пишем снова</text>
  <text class="td" x="1250" y="370">Какой риск и приоритет</text>
</svg>
