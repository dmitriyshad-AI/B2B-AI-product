<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 11</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Проверка перед отправкой: 4 вопроса к</tspan><tspan x="90" dy="56">гладкому ответу</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Это не полный checklist урока 12, а аварийный фильтр, когда текст звучит слишком</tspan><tspan x="90" dy="34">уверенно.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">FW-L11-CASE-A</tspan></text><rect x="90" y="340" width="290" height="220" rx="28" fill="#FBF3E8" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="190" height="40" rx="20" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="132" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="132" dy="0">1. Факт</tspan></text><text x="112" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="112" dy="0">Все числа, даты и</tspan><tspan x="112" dy="27">сравнения совпадают с</tspan><tspan x="112" dy="27">исходником?</tspan></text><line x1="390" y1="450" x2="426" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="440,450 426,442 426,458" fill="#D7D0C1"/><rect x="450" y="340" width="290" height="220" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><rect x="470" y="358" width="190" height="40" rx="20" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="492" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="492" dy="0">2. Вывод</tspan></text><text x="472" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="472" dy="0">Не сделал ли AI более</tspan><tspan x="472" dy="27">широкий вывод, чем</tspan><tspan x="472" dy="27">позволяют данные?</tspan></text><line x1="750" y1="450" x2="786" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="800,450 786,442 786,458" fill="#D7D0C1"/><rect x="810" y="340" width="290" height="220" rx="28" fill="#F3F0FA" stroke="#D7D0C1" stroke-width="2"/><rect x="830" y="358" width="190" height="40" rx="20" fill="#6A56A5" stroke="#6A56A5" stroke-width="2"/><text x="852" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="852" dy="0">3. Контекст</tspan></text><text x="832" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="832" dy="0">Не пропал ли блокер,</tspan><tspan x="832" dy="27">условие или</tspan><tspan x="832" dy="27">ограничение?</tspan></text><line x1="1110" y1="450" x2="1146" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="1160,450 1146,442 1146,458" fill="#D7D0C1"/><rect x="1170" y="340" width="290" height="220" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="1190" y="358" width="190" height="40" rx="20" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="1212" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1212" dy="0">4. Цена ошибки</tspan></text><text x="1192" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1192" dy="0">Что случится, если</tspan><tspan x="1192" dy="27">этот текст уйдет</tspan><tspan x="1192" dy="27">руководителю или</tspan><tspan x="1192" dy="27">клиенту?</tspan></text><rect x="90" y="620" width="1420" height="130" rx="28" fill="#FBF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="670" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Правило экрана</tspan></text><text x="118" y="714" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Если хотя бы на один вопрос ответ неочевиден, summary нельзя пересылать как есть. Сначала</tspan><tspan x="118" dy="28">возвращаемся к источнику и правим.</tspan></text><text x="90" y="792" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="90" dy="0">Этот экран закрывает урок действием: гладкий ответ сначала проверяем, потом используем.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l11_check_before_send</tspan></text></svg>