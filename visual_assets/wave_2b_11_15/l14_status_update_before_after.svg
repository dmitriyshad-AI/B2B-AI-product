<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 14</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Сырой AI-черновик против рабочего</tspan><tspan x="90" dy="56">status update</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Контраст должен показать не литературное улучшение, а рост пригодности к рабочему</tspan><tspan x="90" dy="34">использованию.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L14-CASE-A</tspan></text><rect x="90" y="280" width="640" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="870" y="280" width="640" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="326" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="118" dy="0">Сырой AI-черновик</tspan></text><text x="898" y="326" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#355E4B"><tspan x="898" dy="0">Рабочая версия</tspan></text><text x="118" y="376" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Хочу поделиться обновлением по пилоту. На</tspan><tspan x="118" dy="27">первой неделе у нас уже есть хороший</tspan><tspan x="118" dy="27">прогресс, команда активно отвечает на</tspan><tspan x="118" dy="27">возникающие вопросы, а организационные</tspan><tspan x="118" dy="27">моменты по таблицам остатков и</tspan><tspan x="118" dy="27">юридическому согласованию дальнейшего</tspan><tspan x="118" dy="27">расширения в целом не мешают позитивной</tspan><tspan x="118" dy="27">динамике.</tspan></text><text x="898" y="376" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="898" dy="0">Статус пилота за первую неделю:</tspan><tspan x="898" dy="27">- подключены 3 магазина;</tspan><tspan x="898" dy="27">- еще 2 не готовы: ждем корректные</tspan><tspan x="898" dy="27">таблицы остатков;</tspan><tspan x="898" dy="27">- support получил 14 вопросов, чаще</tspan><tspan x="898" dy="27">всего по доступу;</tspan><tspan x="898" dy="27">- расширение scope не подтверждено: ждем</tspan><tspan x="898" dy="27">юристов;</tspan><tspan x="898" dy="27">- в пятницу решаем, идем ли во вторую</tspan><tspan x="898" dy="27">волну.</tspan></text><rect x="90" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="114" dy="0">Убрали воду</tspan></text><text x="114" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Позитивную динамику заменили</tspan><tspan x="114" dy="24">на наблюдаемые факты.</tspan></text><rect x="445" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="469" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="469" dy="0">Вернули цифры</tspan></text><text x="469" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="469" dy="0">3 магазина, 2 блокера, 14</tspan><tspan x="469" dy="24">вопросов.</tspan></text><rect x="800" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="824" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="824" dy="0">Выделили риски</tspan></text><text x="824" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="824" dy="0">Остатки и юристы вынесены</tspan><tspan x="824" dy="24">как блокеры.</tspan></text><rect x="1155" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1179" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1179" dy="0">Собрали формат</tspan></text><text x="1179" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1179" dy="0">Руководитель считывает</tspan><tspan x="1179" dy="24">статус за 20 секунд.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l14_status_update_before_after</tspan></text></svg>