<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 12</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">До и после проверки: summary по пилоту</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Контраст нужен не ради красоты текста, а чтобы показать возврат сроков, условий и</tspan><tspan x="90" dy="34">реального риска.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L12-CASE-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="120" dy="0">AI-summary до проверки</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#355E4B"><tspan x="890" dy="0">Версия после проверки</tspan></text><text x="120" y="380" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">Пилот стартует в понедельник.</tspan><tspan x="120" dy="28">FAQ можно завершить после запуска.</tspan><tspan x="120" dy="28">Список пользователей желательно</tspan><tspan x="120" dy="28">финализировать на следующей неделе.</tspan><tspan x="120" dy="28">Основной риск в нагрузке на support.</tspan></text><text x="890" y="380" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">Запуск в понедельник возможен только</tspan><tspan x="890" dy="28">если DPA согласован до пятницы 17:00.</tspan><tspan x="890" dy="28">12 пользователей нужны до четверга</tspan><tspan x="890" dy="28">16:00.</tspan><tspan x="890" dy="28">FAQ готовим к пятнице 12:00.</tspan><tspan x="890" dy="28">2 магазина без корректных остатков</tspan><tspan x="890" dy="28">держат подключение под риском.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Что именно вернули в текст: условие по DPA, срок по пользователям, дедлайн FAQ и риск по</tspan><tspan x="120" dy="30">двум магазинам.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l12_summary_before_after</tspan></text></svg>