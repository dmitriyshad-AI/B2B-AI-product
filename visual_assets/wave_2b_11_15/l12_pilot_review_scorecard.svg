<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 12</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">CM-L12-CASE-A: где summary ломается</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Кейс операционного синка показывает, как чек-лист вытаскивает реальные блокеры за</tspan><tspan x="90" dy="34">одну короткую проверку.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L12-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="500" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="220" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Критерий</tspan></text><rect x="310" y="260" width="420" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="326" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="326" dy="0">Что проверяем</tspan></text><rect x="730" y="260" width="780" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="746" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="746" dy="0">Что сломалось в AI-summary</tspan></text><rect x="90" y="330" width="220" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Факты</tspan></text><rect x="310" y="330" width="420" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Сроки, числа, условия</tspan></text><rect x="730" y="330" width="780" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Потерян срок по списку 12 пользователей и условие про DPA до</tspan><tspan x="744" dy="22">пятницы 17:00.</tspan></text><rect x="90" y="388" width="220" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Логика</tspan></text><rect x="310" y="388" width="420" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Следует ли вывод из исходника</tspan></text><rect x="730" y="388" width="780" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Текст говорит, что запуск стабилен, хотя в исходнике есть блокеры</tspan><tspan x="744" dy="22">и условия.</tspan></text><rect x="90" y="446" width="220" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Полнота</tspan></text><rect x="310" y="446" width="420" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Сохранен ли критичный контекст</tspan></text><rect x="730" y="446" width="780" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Выпал риск по 2 магазинам и таблицам остатков.</tspan></text><rect x="90" y="504" width="220" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Тон</tspan></text><rect x="310" y="504" width="420" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Не маскирует ли риск</tspan></text><rect x="730" y="504" width="780" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Summary звучит слишком успокаивающе для рискованной ситуации.</tspan></text><rect x="90" y="562" width="220" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="598" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Применимость</tspan></text><rect x="310" y="562" width="420" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="598" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Можно ли переслать как есть</tspan></text><rect x="730" y="562" width="780" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="598" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Нет. Руководитель получит искаженный статус запуска.</tspan></text><rect x="90" y="620" width="220" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Риск</tspan></text><rect x="310" y="620" width="420" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Цена ошибки при использовании</tspan></text><rect x="730" y="620" width="780" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="744" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="744" dy="0">Можно пообещать понедельничный запуск без фактической готовности.</tspan></text><rect x="90" y="748" width="1420" height="52" rx="18" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="118" y="780" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="118" dy="0">Чек-лист не замедляет работу. Он быстро показывает, что именно надо чинить в ответе.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l12_pilot_review_scorecard</tspan></text></svg>