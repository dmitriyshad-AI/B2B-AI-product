<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 15</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Do / Don't: цифровая гигиена на одном</tspan><tspan x="90" dy="56">экране</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один экран для записи и черновой монтаж: что делаем всегда и что запрещаем себе по</tspan><tspan x="90" dy="34">умолчанию.</tspan></text><rect x="1206" y="70" width="304" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1228" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1228" dy="0">CM-L15-CASE-A / CM-L15-RULESET-A</tspan></text><rect x="90" y="280" width="650" height="430" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="430" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="32" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#355E4B"><tspan x="120" dy="0">Делать</tspan></text><text x="890" y="330" font-size="32" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="890" dy="0">Не делать</tspan></text><circle cx="126" cy="382" r="6" fill="#355E4B"/><text x="148" y="392" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Обезличивать кейс, если это не</tspan><tspan x="148" dy="28">ломает смысл задачи.</tspan></text><circle cx="126" cy="456" r="6" fill="#355E4B"/><text x="148" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Передавать минимум контекста,</tspan><tspan x="148" dy="28">достаточный для ответа.</tspan></text><circle cx="126" cy="530" r="6" fill="#355E4B"/><text x="148" y="540" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Просить структуру, варианты и список</tspan><tspan x="148" dy="28">ручных проверок.</tspan></text><circle cx="126" cy="604" r="6" fill="#355E4B"/><text x="148" y="614" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Проверять чувствительные выводы до</tspan><tspan x="148" dy="28">внешней отправки.</tspan></text><circle cx="896" cy="382" r="6" fill="#9B3D22"/><text x="918" y="392" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="918" dy="0">Вставлять ФИО, телефоны, номера</tspan><tspan x="918" dy="28">договоров и суммы без необходимости.</tspan></text><circle cx="896" cy="456" r="6" fill="#9B3D22"/><text x="918" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="918" dy="0">Грузить целый документ в модель</tspan><tspan x="918" dy="28">только потому, что так быстрее.</tspan></text><circle cx="896" cy="530" r="6" fill="#9B3D22"/><text x="918" y="540" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="918" dy="0">Просить модель принять решение</tspan><tspan x="918" dy="28">вместо вас в чувствительном кейсе.</tspan></text><circle cx="896" cy="604" r="6" fill="#9B3D22"/><text x="918" y="614" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="918" dy="0">Слепо копировать ответ в клиентскую</tspan><tspan x="918" dy="28">или юридическую коммуникацию.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Личная цифровая гигиена сотрудника потом превращается в правило команды, manager checklist и</tspan><tspan x="120" dy="28">company policy.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l15_do_dont</tspan></text></svg>