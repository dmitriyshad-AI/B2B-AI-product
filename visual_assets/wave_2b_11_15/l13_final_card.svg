<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="90" y="90" width="1420" height="720" rx="40" fill="#FBF7EF" stroke="#D7D0C1" stroke-width="2"/><rect x="120" y="120" width="240" height="52" rx="26" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="142" y="154" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="142" dy="0">After Lesson 13</tspan></text><text x="120" y="250" font-size="58" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="120" dy="0">Действие после урока</tspan></text><text x="120" y="360" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="120" dy="0">После урока ученик должен разметить свои реальные задачи, а не просто</tspan><tspan x="120" dy="36">согласиться с теорией.</tspan></text><rect x="120" y="460" width="1360" height="180" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="160" y="530" font-size="33" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="160" dy="0">Разметьте 5 своих рабочих задач по зонам: green,</tspan><tspan x="160" dy="42">yellow, red, и запретите себе копипаст в red.</tspan></text><text x="120" y="705" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="120" dy="0">Если сомневаетесь между yellow и red, ставьте red. Цена лишней осторожности ниже цены</tspan><tspan x="120" dy="28">ложного обещания.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l13_final_card</tspan></text></svg>