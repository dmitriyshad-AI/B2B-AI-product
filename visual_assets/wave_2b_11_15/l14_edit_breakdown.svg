<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 14</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Что именно изменили и зачем</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Таблица помогает показать, что редактура нужна не ради стиля, а ради ясности</tspan><tspan x="90" dy="34">решения.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L14-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="500" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="220" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Шаг</tspan></text><rect x="310" y="260" width="480" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="326" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="326" dy="0">Что сделали</tspan></text><rect x="790" y="260" width="720" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="806" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="806" dy="0">Зачем</tspan></text><rect x="90" y="330" width="220" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Сократили воду</tspan></text><rect x="310" y="330" width="480" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Убрали слова про хороший прогресс и</tspan><tspan x="324" dy="22">позитивную динамику.</tspan></text><rect x="790" y="330" width="720" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="804" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="804" dy="0">Текст перестал маскировать реальный статус за общими</tspan><tspan x="804" dy="22">фразами.</tspan></text><rect x="90" y="388" width="220" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Вернули факты</tspan></text><rect x="310" y="388" width="480" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Назвали 3 магазина, 2 неподключенные</tspan><tspan x="324" dy="22">точки и 14 вопросов в support.</tspan></text><rect x="790" y="388" width="720" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="804" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="804" dy="0">Руководитель видит, что реально произошло за неделю пилота.</tspan></text><rect x="90" y="446" width="220" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Показали блокеры</tspan></text><rect x="310" y="446" width="480" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Отдельно вынесли таблицы остатков и</tspan><tspan x="324" dy="22">ожидание ответа юристов.</tspan></text><rect x="790" y="446" width="720" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="804" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="804" dy="0">Решение по следующей волне не принимается вслепую.</tspan></text><rect x="90" y="504" width="220" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Собрали формат</tspan></text><rect x="310" y="504" width="480" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="324" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="324" dy="0">Сделали короткий список вместо рыхлого</tspan><tspan x="324" dy="22">абзаца.</tspan></text><rect x="790" y="504" width="720" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="804" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="804" dy="0">Статус можно быстро читать, обсуждать и пересылать внутри</tspan><tspan x="804" dy="22">команды.</tspan></text><rect x="90" y="748" width="1420" height="52" rx="18" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="118" y="780" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="118" dy="0">Редактура сильного пользователя AI всегда улучшает пригодность к действию, а не только внешний вид</tspan><tspan x="118" dy="22">текста.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l14_edit_breakdown</tspan></text></svg>