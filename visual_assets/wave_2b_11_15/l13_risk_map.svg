<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 13</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Green / Yellow / Red map</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Экран нужен, чтобы ученик заранее понимал режим использования AI еще до того, как</tspan><tspan x="90" dy="34">получил ответ.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L13-RISK-MAP</tspan></text><rect x="90" y="280" width="380" height="460" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><rect x="114" y="304" width="170" height="44" rx="22" fill="#355E4B" stroke="#355E4B" stroke-width="2"/><text x="136" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="136" dy="0">Зеленая зона</tspan></text><text x="114" y="392" font-size="23" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="114" dy="0">Быстрый черновик допустим.</tspan></text><circle cx="120" cy="450" r="6" fill="#355E4B"/><text x="142" y="460" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Идеи заголовков</tspan></text><circle cx="120" cy="512" r="6" fill="#355E4B"/><text x="142" y="522" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0"