 удобство</tspan><tspan x="118" dy="22">пользователя.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l13_risk_map</tspan></text></svg>