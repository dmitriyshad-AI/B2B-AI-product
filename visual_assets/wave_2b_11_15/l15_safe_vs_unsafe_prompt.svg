<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 15</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Одна задача, два prompt-режима</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Контраст безопасной и небезопасной постановки показывает, что полезность можно</tspan><tspan x="90" dy="34">сохранить без избыточных данных.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L15-CASE-A</tspan></text><rect x="90" y="280" width="650" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="860" y="280" width="650" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="120" dy="0">Небезопасный prompt</tspan></text><text x="890" y="330" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#355E4B"><tspan x="890" dy="0">Безопасная версия той же</tspan><tspan x="890" dy="36">задачи</tspan></text><text x="120" y="380" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="120" dy="0">Проанализируй обращение клиента Ивана</tspan><tspan x="120" dy="28">Петрова.</tspan><tspan x="120" dy="28">Номер договора: 54821.</tspan><tspan x="120" dy="28">Телефон: +7 9XX XXX XX XX.</tspan><tspan x="120" dy="28">Сумма спорного возврата: 184 500 рублей.</tspan><tspan x="120" dy="28">Подскажи, как ответить клиенту и кто</tspan><tspan x="120" dy="28">виноват.</tspan></text><text x="890" y="380" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="890" dy="0">Проанализируй обезличенное обращение по</tspan><tspan x="890" dy="28">спорному возврату.</tspan><tspan x="890" dy="28">Нужно:</tspan><tspan x="890" dy="28">- назвать 2-3 вероятные причины;</tspan><tspan x="890" dy="28">- предложить структуру ответа;</tspan><tspan x="890" dy="28">- перечислить факты для ручной проверки</tspan><tspan x="890" dy="28">до отправки.</tspan><tspan x="890" dy="28">Персональные и чувствительные детали</tspan><tspan x="890" dy="28">убраны.</tspan></text><rect x="90" y="730" width="1420" height="70" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="776" font-size="26" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Задача та же. Разница в том, что модель получает минимально достаточный контекст вместо</tspan><tspan x="120" dy="30">полного чувствительного куска.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l15_safe_vs_unsafe_prompt</tspan></text></svg>