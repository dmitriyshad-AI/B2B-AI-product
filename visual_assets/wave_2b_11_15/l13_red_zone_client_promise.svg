<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 13</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Красная зона: обещание клиенту</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один кейс показывает, почему гладкий ответ модели не равен праву его отправить.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L13-CASE-A</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#FBF1D9" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9A6A10"><tspan x="116" dy="0">Что реально известно</tspan></text><text x="116" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">Скидка 15% не согласована.</tspan><tspan x="116" dy="27">Юристы не подтвердили дату</tspan><tspan x="116" dy="27">запуска.</tspan><tspan x="116" dy="27">Клиент просит письменное</tspan><tspan x="116" dy="27">подтверждение сроков.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="596" dy="0">Небезопасный prompt</tspan></text><text x="596" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">"Напиши клиенту, что дадим</tspan><tspan x="596" dy="27">скидку 15% и запустимся до 1</tspan><tspan x="596" dy="27">апреля. Сделай письмо</tspan><tspan x="596" dy="27">уверенным и спокойным."</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="1076" dy="0">Опасный AI-ответ</tspan></text><text x="1076" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">"Подтверждаем скидку 15% и</tspan><tspan x="1076" dy="27">запуск до 1 апреля. Со своей</tspan><tspan x="1076" dy="27">стороны рисков не видим."</tspan></text><rect x="90" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="114" dy="0">Внешний адресат</tspan></text><text x="114" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Ошибка уходит сразу клиенту,</tspan><tspan x="114" dy="24">а не остается внутри.</tspan></text><rect x="445" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="469" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="469" dy="0">Деньги</tspan></text><text x="469" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="469" dy="0">Скидка превращает черновик в</tspan><tspan x="469" dy="24">финансовое обещание.</tspan></text><rect x="800" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="824" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="824" dy="0">Срок не подтвержден</tspan></text><text x="824" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="824" dy="0">Дата запуска еще не</tspan><tspan x="824" dy="24">согласована юридически.</tspan></text><rect x="1155" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1179" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1179" dy="0">Репутационный риск</tspan></text><text x="1179" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1179" dy="0">Письмо создает</tspan><tspan x="1179" dy="24">обязательство, которого</tspan><tspan x="1179" dy="24">бизнес не подтверждал.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l13_red_zone_client_promise</tspan></text></svg>