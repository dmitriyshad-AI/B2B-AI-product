<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 15</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">5 правил безопасной работы с AI</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Минимальный ruleset нужен каждому сотруднику, даже если до enterprise governance еще</tspan><tspan x="90" dy="34">далеко.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L15-RULESET-A</tspan></text><rect x="90" y="280" width="690" height="140" rx="28" fill="#FBF1D9" stroke="#D7D0C1" stroke-width="2"/><rect x="114" y="300" width="150" height="40" rx="20" fill="#9A6A10" stroke="#9A6A10" stroke-width="2"/><text x="136" y="322" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="136" dy="0">Правило 1</tspan></text><text x="118" y="366" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Не вставляйте персональные данные, если задачу</tspan><tspan x="118" dy="24">можно решить без них.</tspan></text><rect x="820" y="280" width="690" height="140" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><rect x="844" y="300" width="150" height="40" rx="20" fill="#355E4B" stroke="#355E4B" stroke-width="2"/><text x="866" y="322" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="866" dy="0">Правило 2</tspan></text><text x="848" y="366" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Не передавайте номера договоров, суммы и</tspan><tspan x="848" dy="24">чувствительные условия без явной необходимости и</tspan><tspan x="848" dy="24">понимания policy.</tspan></text><rect x="90" y="435" width="690" height="140" rx="28" fill="#F3F0FA" stroke="#D7D0C1" stroke-width="2"/><rect x="114" y="455" width="150" height="40" rx="20" fill="#6A56A5" stroke="#6A56A5" stroke-width="2"/><text x="136" y="477" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="136" dy="0">Правило 3</tspan></text><text x="118" y="521" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Лучше кратко пересказать документ, чем загружать</tspan><tspan x="118" dy="24">его целиком только ради удобства.</tspan></text><rect x="820" y="435" width="690" height="140" rx="28" fill="#F7F3EA" stroke="#D7D0C1" stroke-width="2"/><rect x="844" y="455" width="150" height="40" rx="20" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="866" y="477" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="866" dy="0">Правило 4</tspan></text><text x="848" y="521" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Каждый раз спрашивайте себя: какой минимальный</tspan><tspan x="848" dy="24">контекст действительно нужен модели?</tspan></text><rect x="90" y="590" width="690" height="140" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="114" y="610" width="150" height="40" rx="20" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="136" y="632" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="136" dy="0">Правило 5</tspan></text><text x="118" y="676" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Если цена утечки или ошибки высокая, сначала</tspan><tspan x="118" dy="24">смотрите на корпоративные правила, а не на</tspan><tspan x="118" dy="24">скорость.</tspan></text><rect x="820" y="590" width="690" height="140" rx="28" fill="#EEF0F6" stroke="#D7D0C1" stroke-width="2"/><rect x="844" y="610" width="150" height="40" rx="20" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="866" y="632" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="866" dy="0">Итог</tspan></text><text x="848" y="676" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Безопасность не мешает полезности. Она убирает</tspan><tspan x="848" dy="24">лишний риск из входа и оставляет рабочий смысл</tspan><tspan x="848" dy="24">задачи.</tspan></text><rect x="90" y="750" width="1420" height="50" rx="28" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="120" y="780" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Если задачу можно решить на обезличенном описании, нельзя тащить в prompt сырой чувствительный</tspan><tspan x="120" dy="26">фрагмент.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l15_safety_rules_checklist</tspan></text></svg>