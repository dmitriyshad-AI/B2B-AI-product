<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 11</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Кейс: sales summary с ложной</tspan><tspan x="90" dy="56">уверенностью</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один кейс показывает, как уверенный tone of voice маскирует фактологическую и</tspan><tspan x="90" dy="34">управленческую ошибку.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">FW-L11-CASE-A</tspan></text><rect x="90" y="280" width="390" height="420" rx="28" fill="#FBF1D9" stroke="#D7D0C1" stroke-width="2"/><text x="116" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9A6A10"><tspan x="116" dy="0">Что было в заметках</tspan></text><text x="116" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="116" dy="0">214 лидов против 182.</tspan><tspan x="116" dy="27">Демо: 31% против 34% в</tspan><tspan x="116" dy="27">январе.</tspan><tspan x="116" dy="27">8 сделок на 6,4 млн руб.</tspan><tspan x="116" dy="27">Узкие места: юристы и слабый</tspan><tspan x="116" dy="27">follow-up.</tspan></text><rect x="570" y="280" width="390" height="420" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><text x="596" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#355E4B"><tspan x="596" dy="0">Что уверенно написал</tspan><tspan x="596" dy="34">AI</tspan></text><text x="596" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="596" dy="0">"Конверсия поднялась до 31%.</tspan><tspan x="596" dy="27">Юридический процесс</tspan><tspan x="596" dy="27">ускорился. Узких мест почти</tspan><tspan x="596" dy="27">нет. Можно увеличивать</tspan><tspan x="596" dy="27">нагрузку на команду."</tspan></text><rect x="1050" y="280" width="390" height="420" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><text x="1076" y="325" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="1076" dy="0">Что должен понять</tspan><tspan x="1076" dy="34">руководитель</tspan></text><text x="1076" y="370" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1076" dy="0">Лидов стало больше, но</tspan><tspan x="1076" dy="27">конверсия в демо просела.</tspan><tspan x="1076" dy="27">Рост выручки не отменяет два</tspan><tspan x="1076" dy="27">блокера.</tspan><tspan x="1076" dy="27">Масштабировать процесс рано.</tspan></text><rect x="90" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#9B3D22"><tspan x="114" dy="0">Факт сдвинут</tspan></text><text x="114" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">31% ниже 34%, а не рост.</tspan></text><rect x="445" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="469" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="469" dy="0">Причина перевернута</tspan></text><text x="469" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="469" dy="0">Юристы и follow-up были</tspan><tspan x="469" dy="24">проблемой.</tspan></text><rect x="800" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="824" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A56A5"><tspan x="824" dy="0">Контекст потерян</tspan></text><text x="824" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="824" dy="0">AI убрал узкие места из</tspan><tspan x="824" dy="24">вывода.</tspan></text><rect x="1155" y="700" width="330" height="104" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><text x="1179" y="734" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1179" dy="0">Решение опасно</tspan></text><text x="1179" y="768" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1179" dy="0">Ложный позитив толкает к</tspan><tspan x="1179" dy="24">неверному действию.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l11_sales_summary_compare</tspan></text></svg>