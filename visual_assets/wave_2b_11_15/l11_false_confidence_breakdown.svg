<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 11</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Разбор ошибки по строкам</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Таблица нужна, чтобы в кадре было видно: проблема не в стиле текста, а в сдвиге</tspan><tspan x="90" dy="34">смысла и решения.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">FW-L11-CASE-A</tspan></text><rect x="90" y="260" width="1420" height="500" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="260" width="280" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="106" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="106" dy="0">Ошибка</tspan></text><rect x="370" y="260" width="540" height="70" rx="0" fill="#E8F0EC" stroke="#D7D0C1" stroke-width="2"/><text x="386" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="386" dy="0">Что не так</tspan></text><rect x="910" y="260" width="600" height="70" rx="0" fill="#EFE7D8" stroke="#D7D0C1" stroke-width="2"/><text x="926" y="304" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="926" dy="0">Чем опасно</tspan></text><rect x="90" y="330" width="280" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Неверная динамика</tspan></text><rect x="370" y="330" width="540" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="384" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="384" dy="0">31% ниже 34%, но AI подает это как рост</tspan><tspan x="384" dy="22">конверсии.</tspan></text><rect x="910" y="330" width="600" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="924" y="366" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="924" dy="0">Руководитель видит несуществующее улучшение</tspan><tspan x="924" dy="22">воронки.</tspan></text><rect x="90" y="388" width="280" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Искаженная причина</tspan></text><rect x="370" y="388" width="540" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="384" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="384" dy="0">Юристы и follow-up названы драйвером, хотя</tspan><tspan x="384" dy="22">это явные проблемы.</tspan></text><rect x="910" y="388" width="600" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="924" y="424" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="924" dy="0">Команда закрепляет неправильное объяснение</tspan><tspan x="924" dy="22">результата.</tspan></text><rect x="90" y="446" width="280" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Завышение эффекта</tspan></text><rect x="370" y="446" width="540" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="384" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="384" dy="0">Рост выручки есть, но не подтверждает тезис о</tspan><tspan x="384" dy="22">сильном масштабировании.</tspan></text><rect x="910" y="446" width="600" height="58" rx="0" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="1"/><text x="924" y="482" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="924" dy="0">Менеджмент получает ложное ощущение зрелости</tspan><tspan x="924" dy="22">процесса.</tspan></text><rect x="90" y="504" width="280" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Потеря узких мест</tspan></text><rect x="370" y="504" width="540" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="384" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="384" dy="0">Ответ пишет, что узких мест почти нет.</tspan></text><rect x="910" y="504" width="600" height="58" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="924" y="540" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="924" dy="0">Реальные точки провала не будут исправлены</tspan><tspan x="924" dy="22">вовремя.</tspan></text><rect x="90" y="748" width="1420" height="52" rx="18" fill="#10213B" stroke="#10213B" stroke-width="2"/><text x="118" y="780" font-size="19" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="118" dy="0">Опасность урока: чем правдоподобнее формулировка, тем легче пропустить ошибку до отправки.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l11_false_confidence_breakdown</tspan></text></svg>