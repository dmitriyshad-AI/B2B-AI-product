<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><text x="90" y="90" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="90" dy="0">Урок 14</tspan></text><text x="90" y="150" font-size="48" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">5 движений до рабочего результата</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Это не набор красивых советов, а короткий процесс редактуры, который можно повторять</tspan><tspan x="90" dy="34">на каждом AI-черновике.</tspan></text><rect x="1300" y="70" width="210" height="54" rx="27" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1322" y="106" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1322" dy="0">CM-L14-CASE-A</tspan></text><rect x="90" y="340" width="240" height="220" rx="28" fill="#FFF1EA" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="190" height="40" rx="20" fill="#9B3D22" stroke="#9B3D22" stroke-width="2"/><text x="132" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="132" dy="0">1. Убрать воду</tspan></text><text x="112" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="112" dy="0">Снимаем общие</tspan><tspan x="112" dy="27">слова, которые</tspan><tspan x="112" dy="27">маскируют реальный</tspan><tspan x="112" dy="27">статус.</tspan></text><line x1="340" y1="450" x2="346" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="360,450 346,442 346,458" fill="#D7D0C1"/><rect x="370" y="340" width="240" height="220" rx="28" fill="#FBF3E8" stroke="#D7D0C1" stroke-width="2"/><rect x="390" y="358" width="190" height="40" rx="20" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="412" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="412" dy="0">2. Вернуть факты</tspan></text><text x="392" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="392" dy="0">Числа, сроки,</tspan><tspan x="392" dy="27">условия и</tspan><tspan x="392" dy="27">зависимости</tspan><tspan x="392" dy="27">вставляем обратно.</tspan></text><line x1="620" y1="450" x2="626" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="640,450 626,442 626,458" fill="#D7D0C1"/><rect x="650" y="340" width="240" height="220" rx="28" fill="#F3F0FA" stroke="#D7D0C1" stroke-width="2"/><rect x="670" y="358" width="190" height="40" rx="20" fill="#6A56A5" stroke="#6A56A5" stroke-width="2"/><text x="692" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="692" dy="0">3. Выделить блокеры</tspan></text><text x="672" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="672" dy="0">Отдельно</tspan><tspan x="672" dy="27">показываем, что</tspan><tspan x="672" dy="27">тормозит решение и</tspan><tspan x="672" dy="27">запуск.</tspan></text><line x1="900" y1="450" x2="906" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="920,450 906,442 906,458" fill="#D7D0C1"/><rect x="930" y="340" width="240" height="220" rx="28" fill="#FBF1D9" stroke="#D7D0C1" stroke-width="2"/><rect x="950" y="358" width="190" height="40" rx="20" fill="#9A6A10" stroke="#9A6A10" stroke-width="2"/><text x="972" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="972" dy="0">4. Подстроить адресата</tspan></text><text x="952" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="952" dy="0">Формулируем так,</tspan><tspan x="952" dy="27">чтобы конкретный</tspan><tspan x="952" dy="27">читатель быстро</tspan><tspan x="952" dy="27">понял смысл.</tspan></text><line x1="1180" y1="450" x2="1186" y2="450" stroke="#D7D0C1" stroke-width="4"/><polygon points="1200,450 1186,442 1186,458" fill="#D7D0C1"/><rect x="1210" y="340" width="240" height="220" rx="28" fill="#EEF5F1" stroke="#D7D0C1" stroke-width="2"/><rect x="1230" y="358" width="190" height="40" rx="20" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1252" y="380" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1252" dy="0">5. Довести формат</tspan></text><text x="1232" y="432" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1232" dy="0">Письмо, note,</tspan><tspan x="1232" dy="27">summary или status</tspan><tspan x="1232" dy="27">update должны</tspan><tspan x="1232" dy="27">выглядеть как</tspan><tspan x="1232" dy="27">рабочий артефакт.</tspan></text><rect x="90" y="620" width="1420" height="130" rx="28" fill="#FBF7EF" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="670" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="118" dy="0">Проверка готовности</tspan></text><text x="118" y="714" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Если адресат за 20 секунд понимает факты, риски и следующий шаг, черновик уже превратился</tspan><tspan x="118" dy="28">в рабочий результат.</tspan></text><text x="90" y="792" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="90" dy="0">Этот workflow закрывает главный тезис урока: не копировать, а доводить до стандарта задачи.</tspan></text><line x1="90" y1="820" x2="1510" y2="820" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 2B visual asset · Lessons 11-15 production pack</tspan></text><text x="1115" y="855" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1115" dy="0">l14_edit_moves_workflow</tspan></text></svg>