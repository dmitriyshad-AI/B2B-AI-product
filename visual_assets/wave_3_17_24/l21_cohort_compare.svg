<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#edf1f2" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#faf4f0" stroke="#faf4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 21</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Когортный анализ vs обычная</tspan><tspan x="90" dy="56">помесячная статистика</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Сильное объяснение не останавливается на определении: оно снимает типичную путаницу через</tspan><tspan x="90" dy="32">прямое сравнение.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#af652a" stroke="#af652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L21-CASE-A</tspan></text><rect x="90" y="274" width="1420" height="504" rx="28" fill="#FFFDF8" stroke="#D7D0C1" stroke-width="2"/><rect x="90" y="274" width="310" height="72" rx="0" fill="#e8eeee" stroke="#D7D0C1" stroke-width="2"/><text x="104" y="320" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="104" dy="0">Вопрос</tspan></text><rect x="400" y="274" width="555" height="72" rx="0" fill="#f7f0e9" stroke="#D7D0C1" stroke-width="2"/><text x="414" y="320" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="414" dy="0">Когортный анализ</tspan></text><rect x="955" y="274" width="555" height="72" rx="0" fill="#F0ECE3" stroke="#D7D0C1" stroke-width="2"/><text x="969" y="320" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="969" dy="0">Обычная помесячная статистика</tspan></text><rect x="90" y="346" width="310" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="376" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Что показывает</tspan></text><rect x="400" y="346" width="555" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="376" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">поведение одной группы во времени</tspan></text><rect x="955" y="346" width="555" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="969" y="376" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="969" dy="0">общее состояние за месяц</tspan></text><rect x="90" y="430" width="310" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="460" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Где полезен</tspan></text><rect x="400" y="430" width="555" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="460" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">удержание, повторные действия, качество набора</tspan></text><rect x="955" y="430" width="555" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="969" y="460" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="969" dy="0">общий объем, динамика периода</tspan></text><rect x="90" y="514" width="310" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="544" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Ошибка новичка</tspan></text><rect x="400" y="514" width="555" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="544" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">думать, что это просто еще одна сводка по месяцам</tspan></text><rect x="955" y="514" width="555" height="84" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="969" y="544" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="969" dy="0">делать вывод о качестве удержания без разбивки по</tspan><tspan x="969" dy="22">группам</tspan></text><rect x="90" y="598" width="310" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="628" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Когда брать</tspan></text><rect x="400" y="598" width="555" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="414" y="628" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="414" dy="0">когда важно понять, что происходит с конкретной</tspan><tspan x="414" dy="22">волной пользователей</tspan></text><rect x="955" y="598" width="555" height="84" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="969" y="628" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="969" dy="0">когда нужна общая картина периода</tspan></text><text x="90" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Если после объяснения не стало проще различать похожие понятия, значит, learning loop не закончен.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l21_cohort_compare</tspan></text></svg>