<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#f7f0ed" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f0f4f3" stroke="#f0f4f3" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#A04428" stroke="#A04428" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 22</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Practical filter: стоит ли вообще</tspan><tspan x="90" dy="56">внедрять этот сценарий</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Перед внедрением сценарий должен пройти короткий фильтр полезности, а не только показаться</tspan><tspan x="90" dy="32">интересным.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#2d6659" stroke="#2d6659" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L22-CASE-A / L22-CASE-B</tspan></text><rect x="90" y="290" width="840" height="470" rx="28" fill="#f9f3f2" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#A04428"><tspan x="120" dy="0">5 вопросов фильтра полезности</tspan></text><circle cx="130" cy="390" r="5" fill="#A04428"/><text x="148" y="398" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Это повторяется хотя бы несколько раз в неделю?</tspan></text><circle cx="130" cy="440" r="5" fill="#A04428"/><text x="148" y="448" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Результат можно быстро оценить?</tspan></text><circle cx="130" cy="490" r="5" fill="#A04428"/><text x="148" y="498" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Есть экономия времени или снижение трения?</tspan></text><circle cx="130" cy="540" r="5" fill="#A04428"/><text x="148" y="548" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Это можно встроить в реальный процесс?</tspan></text><circle cx="130" cy="590" r="5" fill="#A04428"/><text x="148" y="598" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Я готов повторить это завтра без героизма?</tspan></text><rect x="970" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#A04428"><tspan x="990" dy="0">CASE-A</tspan></text><text x="990" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">1-2 'да'. Интересно,</tspan><tspan x="990" dy="24">но нет repeatable</tspan><tspan x="990" dy="24">value и measurable</tspan><tspan x="990" dy="24">effect.</tspan></text><rect x="1245" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B5C"><tspan x="1265" dy="0">CASE-B</tspan></text><text x="1265" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">4-5 'да'. Повторяемый</tspan><tspan x="1265" dy="24">сценарий с ясным</tspan><tspan x="1265" dy="24">результатом и рабочим</tspan><tspan x="1265" dy="24">SLA.</tspan></text><rect x="970" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="990" dy="0">Решение</tspan></text><text x="990" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">4-5 = внедряем, 2-3 =</tspan><tspan x="990" dy="24">тестируем, 0-1 = не</tspan><tspan x="990" dy="24">тратим время на</tspan><tspan x="990" dy="24">rollout</tspan></text><rect x="1245" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A4A24"><tspan x="1265" dy="0">Смысл фильтра</tspan></text><text x="1265" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">AI должен стать частью</tspan><tspan x="1265" dy="24">процесса, а не разовым</tspan><tspan x="1265" dy="24">развлечением под</tspan><tspan x="1265" dy="24">впечатлением</tspan></text><text x="90" y="790" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Самая частая ошибка - путать интерес к технологии с реальным изменением рабочего процесса.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l22_practical_filter_scorecard</tspan></text></svg>