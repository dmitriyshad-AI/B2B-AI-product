<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#f7f0ed" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f0f4f3" stroke="#f0f4f3" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#A04428" stroke="#A04428" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 22</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Простой, но полезный сценарий:</tspan><tspan x="90" dy="56">follow-up после созвона</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Взрослый B2C/B2B сценарий видно по конкретным метрикам: время, SLA и повторяемость.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#2d6659" stroke="#2d6659" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L22-CASE-B</tspan></text><rect x="90" y="290" width="840" height="470" rx="28" fill="#f9f3f2" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#A04428"><tspan x="120" dy="0">Почему это уже инструмент, а не игрушка</tspan></text><circle cx="130" cy="390" r="5" fill="#A04428"/><text x="148" y="398" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Сценарий повторяется после каждого клиентского созвона.</tspan></text><circle cx="130" cy="440" r="5" fill="#A04428"/><text x="148" y="448" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Результат понятен: короткое follow-up письмо с договоренностями и</tspan><tspan x="148" dy="28">следующим шагом.</tspan></text><circle cx="130" cy="518" r="5" fill="#A04428"/><text x="148" y="526" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Процесс легко встроить в ежедневную работу аккаунт-менеджера.</tspan></text><rect x="970" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#A04428"><tspan x="990" dy="0">До AI</tspan></text><text x="990" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">8-10 минут на письмо</tspan><tspan x="990" dy="24">после звонка</tspan></text><rect x="1245" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B5C"><tspan x="1265" dy="0">С AI</tspan></text><text x="1265" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">2-3 минуты до первого</tspan><tspan x="1265" dy="24">черновика</tspan></text><rect x="970" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="990" dy="0">SLA</tspan></text><text x="990" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">письма стабильно</tspan><tspan x="990" dy="24">уходят в течение 30</tspan><tspan x="990" dy="24">минут после встречи</tspan></text><rect x="1245" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A4A24"><tspan x="1265" dy="0">Контроль</tspan></text><text x="1265" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">ручная правка</tspan><tspan x="1265" dy="24">обязательна: AI не</tspan><tspan x="1265" dy="24">добавляет обещаний,</tspan><tspan x="1265" dy="24">которых не было</tspan></text><text x="90" y="790" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Зрелый сценарий всегда можно описать как процесс, артефакт и measurable effect.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l22_followup_impact_metrics</tspan></text></svg>