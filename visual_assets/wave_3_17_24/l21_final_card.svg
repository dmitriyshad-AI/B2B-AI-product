<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="90" y="90" width="1420" height="700" rx="42" fill="#e7ebec" stroke="#D7D0C1" stroke-width="2"/><rect x="120" y="120" width="1360" height="560" rx="36" fill="white" stroke="#D7D0C1" stroke-width="2"/><rect x="140" y="140" width="210" height="50" rx="25" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="164" y="172" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="164" dy="0">После урока</tspan></text><text x="140" y="285" font-size="60" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="140" dy="0">После урока: используйте AI</tspan><tspan x="140" dy="68">для объяснения одной новой</tspan><tspan x="140" dy="68">темы</tspan></text><text x="140" y="390" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Сильный результат урока - не просто понять термин, а пройти</tspan><tspan x="140" dy="36">learning loop до обратной связи на свой ответ.</tspan></text><rect x="140" y="470" width="1320" height="150" rx="28" fill="#f9f3ee" stroke="#D7D0C1" stroke-width="2"/><text x="175" y="530" font-size="34" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="175" dy="0">Возьмите одну новую тему и заставьте AI не</tspan><tspan x="175" dy="42">только объяснить ее, но и проверить ваш ответ по</tspan><tspan x="175" dy="42">ней.</tspan></text><text x="140" y="725" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Если вопрос важен для работы, финальный проверка по внешним источникам всегда остается за внешними</tspan><tspan x="140" dy="28">источниками.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l21_final_card</tspan></text></svg>