<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#eef3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#2F6B83" stroke="#2F6B83" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 18</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Три точки применения AI вокруг</tspan><tspan x="90" dy="56">встречи</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">До встречи нужна структура, после встречи нужна фиксация, между статусами нужен контекст.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L18-CASE-A / FW-L18-CASE-B</tspan></text><rect x="90" y="340" width="341" height="240" rx="28" fill="#eef3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#2F6B83" stroke="#2F6B83" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B83"><tspan x="114" dy="0">До встречи</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Контекст, цель, 30-минутная</tspan><tspan x="114" dy="24">agenda и список точных</tspan><tspan x="114" dy="24">вопросов.</tspan></text><line x1="431" y1="460" x2="443" y2="460" stroke="#2d667d" stroke-width="4"/><polygon points="443,460 429,452 429,468" fill="#2d667d"/><rect x="449" y="340" width="341" height="240" rx="28" fill="#f1f3f2" stroke="#D7D0C1" stroke-width="2"/><rect x="469" y="358" width="72" height="36" rx="18" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="493" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="493" dy="0">2</tspan></text><text x="473" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="473" dy="0">Во время</tspan></text><text x="473" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="473" dy="0">Не уходим в детали: решаем срок</tspan><tspan x="473" dy="24">запуска, cut scope и owner</tspan><tspan x="473" dy="24">коммуникации.</tspan></text><line x1="790" y1="460" x2="802" y2="460" stroke="#2d667d" stroke-width="4"/><polygon points="802,460 788,452 788,468" fill="#2d667d"/><rect x="808" y="340" width="341" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="828" y="358" width="72" height="36" rx="18" fill="#2F6B83" stroke="#2F6B83" stroke-width="2"/><text x="852" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="852" dy="0">3</tspan></text><text x="832" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B83"><tspan x="832" dy="0">После встречи</tspan></text><text x="832" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="832" dy="0">Follow-up: решения, owner,</tspan><tspan x="832" dy="24">сроки и подтвержденный</tspan><tspan x="832" dy="24">следующий статус.</tspan></text><line x1="1149" y1="460" x2="1161" y2="460" stroke="#2d667d" stroke-width="4"/><polygon points="1161,460 1147,452 1147,468" fill="#2d667d"/><rect x="1167" y="340" width="341" height="240" rx="28" fill="#EFF4F1" stroke="#D7D0C1" stroke-width="2"/><rect x="1187" y="358" width="72" height="36" rx="18" fill="#5A7268" stroke="#5A7268" stroke-width="2"/><text x="1211" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1211" dy="0">4</tspan></text><text x="1191" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1191" dy="0">Между статусами</tspan></text><text x="1191" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1191" dy="0">Коротко восстанавливаем</tspan><tspan x="1191" dy="24">контекст, обязательства и</tspan><tspan x="1191" dy="24">открытые риски.</tspan></text><rect x="120" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="140" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B83"><tspan x="140" dy="0">Формат</tspan></text><text x="140" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="140" dy="0">30 минут на статус-созвон</tspan></text><rect x="550" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="570" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="570" dy="0">Риск</tspan></text><text x="570" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="570" dy="0">сдвиг проекта на 8 рабочих дней</tspan></text><rect x="980" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1000" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1000" dy="0">Сигнал</tspan></text><text x="1000" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1000" dy="0">7 критичных дефектов уже найдены</tspan><tspan x="1000" dy="24">QA</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#295c71" stroke="#295c71" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">AI здесь структурирует подготовку и фиксацию, но не принимает решение за команду.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l18_meeting_window</tspan></text></svg>