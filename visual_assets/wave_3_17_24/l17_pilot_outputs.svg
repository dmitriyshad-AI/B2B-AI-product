<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#faf1ed" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 17</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Один документ -&gt; три разных экрана</tspan><tspan x="90" dy="56">пользы</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Полезный summary меняется в зависимости от вопроса: что здесь главное, что опасно и что</tspan><tspan x="90" dy="32">делать дальше.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L17-CASE-A</tspan></text><rect x="90" y="290" width="460" height="470" rx="28" fill="#faf1ed" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="114" dy="0">Summary на 5 буллетов</tspan></text><circle cx="124" cy="380" r="5" fill="#C65A1E"/><text x="142" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Двухнедельный пилот AI-шаблонов</tspan><tspan x="142" dy="28">в клиентском сервисе.</tspan></text><circle cx="124" cy="458" r="5" fill="#C65A1E"/><text x="142" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">6 специалистов первой линии.</tspan></text><circle cx="124" cy="508" r="5" fill="#C65A1E"/><text x="142" y="516" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Шаблоны приветствия, follow-up и</tspan><tspan x="142" dy="28">edit mode.</tspan></text><circle cx="124" cy="586" r="5" fill="#C65A1E"/><text x="142" y="594" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Нельзя загружать полные диалоги</tspan><tspan x="142" dy="28">и обещать сроки через AI.</tspan></text><circle cx="124" cy="664" r="5" fill="#C65A1E"/><text x="142" y="672" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">По итогам проверяем скорость,</tspan><tspan x="142" dy="28">reuse шаблонов и качество</tspan><tspan x="142" dy="28">ответов.</tspan></text><rect x="570" y="290" width="460" height="470" rx="28" fill="#f1f3f2" stroke="#D7D0C1" stroke-width="2"/><text x="594" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="594" dy="0">Риски и спорные места</tspan></text><circle cx="604" cy="380" r="5" fill="#5A7268"/><text x="622" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Слишком длинные ответы выглядят</tspan><tspan x="622" dy="28">искусственно.</tspan></text><circle cx="604" cy="458" r="5" fill="#5A7268"/><text x="622" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Разные шаблоны размоют общий</tspan><tspan x="622" dy="28">tone of voice.</tspan></text><circle cx="604" cy="536" r="5" fill="#5A7268"/><text x="622" y="544" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Без owner библиотека быстро</tspan><tspan x="622" dy="28">перестанет быть полезной.</tspan></text><circle cx="604" cy="614" r="5" fill="#5A7268"/><text x="622" y="622" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Публичный AI для сырых диалогов</tspan><tspan x="622" dy="28">= риск утечки.</tspan></text><rect x="1050" y="290" width="460" height="470" rx="28" fill="#F4EEE3" stroke="#D7D0C1" stroke-width="2"/><text x="1074" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#b0521e"><tspan x="1074" dy="0">Action items до старта</tspan></text><circle cx="1084" cy="380" r="5" fill="#C65A1E"/><text x="1102" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Назначить owner библиотеки.</tspan></text><circle cx="1084" cy="430" r="5" fill="#C65A1E"/><text x="1102" y="438" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Разделить разрешенные и</tspan><tspan x="1102" dy="28">запрещенные сценарии.</tspan></text><circle cx="1084" cy="508" r="5" fill="#C65A1E"/><text x="1102" y="516" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Дать команде короткий стандарт</tspan><tspan x="1102" dy="28">ручной правки.</tspan></text><circle cx="1084" cy="586" r="5" fill="#C65A1E"/><text x="1102" y="594" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Определить, кто и как делает</tspan><tspan x="1102" dy="28">review спорных ответов.</tspan></text><rect x="90" y="724" width="1420" height="82" rx="28" fill="#a14c1f" stroke="#a14c1f" stroke-width="2"/><text x="122" y="772" font-size="25" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="122" dy="0">Не просим 'summary вообще' - просим конкретный рабочий слой из текста.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l17_pilot_outputs</tspan></text></svg>