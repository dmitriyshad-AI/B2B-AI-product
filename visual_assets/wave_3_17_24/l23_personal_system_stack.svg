<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#eceff2" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f6f4f0" stroke="#f6f4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 23</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Пять блоков личной AI-системы</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Система нужна не для красоты, а чтобы хороший сценарий можно было повторить через неделю и</tspan><tspan x="90" dy="32">через месяц.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#83652a" stroke="#83652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L23-CASE-A</tspan></text><rect x="90" y="340" width="269" height="240" rx="28" fill="#eceff2" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="114" dy="0">Сценарии</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Список повторяющихся</tspan><tspan x="114" dy="24">задач: follow-up,</tspan><tspan x="114" dy="24">summary документа,</tspan><tspan x="114" dy="24">внутренние сообщения.</tspan></text><line x1="359" y1="460" x2="371" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="371,460 357,452 357,468" fill="#153b5e"/><rect x="377" y="340" width="269" height="240" rx="28" fill="#f5f3ee" stroke="#D7D0C1" stroke-width="2"/><rect x="397" y="358" width="72" height="36" rx="18" fill="#8A6A2B" stroke="#8A6A2B" stroke-width="2"/><text x="421" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="421" dy="0">2</tspan></text><text x="401" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#8A6A2B"><tspan x="401" dy="0">Шаблоны</tspan></text><text x="401" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="401" dy="0">Лучшие prompts и</tspan><tspan x="401" dy="24">заготовки: followup_v2,</tspan><tspan x="401" dy="24">summary_ops_v1, tone-</tspan><tspan x="401" dy="24">edit.</tspan></text><line x1="646" y1="460" x2="658" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="658,460 644,452 644,468" fill="#153b5e"/><rect x="664" y="340" width="269" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="684" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="708" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="708" dy="0">3</tspan></text><text x="688" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="688" dy="0">Проверка</tspan></text><text x="688" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="688" dy="0">Короткий quality</tspan><tspan x="688" dy="24">checklist: факт,</tspan><tspan x="688" dy="24">контекст, тон, следующий</tspan><tspan x="688" dy="24">шаг, лишние обещания.</tspan></text><line x1="933" y1="460" x2="945" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="945,460 931,452 931,468" fill="#153b5e"/><rect x="951" y="340" width="269" height="240" rx="28" fill="#EFF4F1" stroke="#D7D0C1" stroke-width="2"/><rect x="971" y="358" width="72" height="36" rx="18" fill="#8A6A2B" stroke="#8A6A2B" stroke-width="2"/><text x="995" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="995" dy="0">4</tspan></text><text x="975" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#8A6A2B"><tspan x="975" dy="0">Безопасность</tspan></text><text x="975" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="975" dy="0">Что нельзя отправлять в</tspan><tspan x="975" dy="24">AI: персональные данные,</tspan><tspan x="975" dy="24">конфиденциальные цифры,</tspan><tspan x="975" dy="24">неанонимизированные</tspan><tspan x="975" dy="24">договоры.</tspan></text><line x1="1220" y1="460" x2="1232" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="1232,460 1218,452 1218,468" fill="#153b5e"/><rect x="1238" y="340" width="269" height="240" rx="28" fill="#F5F1FA" stroke="#D7D0C1" stroke-width="2"/><rect x="1258" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="1282" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1282" dy="0">5</tspan></text><text x="1262" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="1262" dy="0">Proof log</tspan></text><text x="1262" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1262" dy="0">Что реально сработало:</tspan><tspan x="1262" dy="24">сценарий, дата, эффект,</tspan><tspan x="1262" dy="24">оставшийся риск.</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#143756" stroke="#143756" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">Любой формат хранения подходит, если он помогает повторять лучшую практику, а не только выглядит</tspan><tspan x="116" dy="26">организованно.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l23_personal_system_stack</tspan></text></svg>