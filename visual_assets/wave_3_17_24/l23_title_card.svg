<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="90" y="90" width="1420" height="700" rx="42" fill="#e3e7ec" stroke="#D7D0C1" stroke-width="2"/><rect x="120" y="120" width="1360" height="560" rx="36" fill="white" stroke="#D7D0C1" stroke-width="2"/><rect x="140" y="140" width="210" height="50" rx="25" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="164" y="172" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="164" dy="0">Урок 23</tspan></text><text x="140" y="285" font-size="60" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="140" dy="0">Как строить личную систему</tspan><tspan x="140" dy="68">использования AI</tspan></text><text x="140" y="390" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Зрелое использование AI - это связка: задача, шаблон, проверка,</tspan><tspan x="140" dy="36">хранение лучшей практики.</tspan></text><rect x="140" y="470" width="1320" height="150" rx="28" fill="#f5f3ee" stroke="#D7D0C1" stroke-width="2"/><text x="175" y="530" font-size="34" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="175" dy="0">Сильная AI-система не выглядит красиво ради</tspan><tspan x="175" dy="42">себя: она помогает повторять удачные сценарии</tspan><tspan x="175" dy="42">без хаоса.</tspan></text><text x="140" y="725" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Минимальная форма хранения может быть очень простой: одна таблица, один документ, один</tspan><tspan x="140" dy="28">Notion workspace или одна папка.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l23_title_card</tspan></text></svg>