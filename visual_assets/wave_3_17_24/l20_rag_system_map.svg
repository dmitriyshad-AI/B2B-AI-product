<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#f0f3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f9f5f0" stroke="#f9f5f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#496A8B" stroke="#496A8B" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 20</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">RAG на одном экране</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Concrete screen для быстрого объяснения: модель отвечает не только из памяти, а с опорой</tspan><tspan x="90" dy="32">на внешний найденный контекст.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#ad7631" stroke="#ad7631" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L20-CASE-A</tspan></text><rect x="90" y="290" width="690" height="190" rx="28" fill="#f2f4f6" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="340" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#496A8B"><tspan x="118" dy="0">1. Пользовательский вопрос</tspan></text><text x="118" y="382" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Запрос формулирует, какую задачу система</tspan><tspan x="118" dy="27">должна решить и по какому документному</tspan><tspan x="118" dy="27">слою искать ответ.</tspan></text><rect x="820" y="290" width="690" height="190" rx="28" fill="#f9f5f0" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="340" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B67B32"><tspan x="848" dy="0">2. Retrieval</tspan></text><text x="848" y="382" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Система ищет релевантные куски документов,</tspan><tspan x="848" dy="27">а не пытается отвечать только из</tspan><tspan x="848" dy="27">внутренних знаний модели.</tspan></text><rect x="90" y="535" width="690" height="190" rx="28" fill="#F3EFE7" stroke="#D7D0C1" stroke-width="2"/><text x="118" y="585" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#436180"><tspan x="118" dy="0">3. Контекст в модель</tspan></text><text x="118" y="627" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="118" dy="0">Найденные фрагменты подаются в prompt,</tspan><tspan x="118" dy="27">чтобы ответ опирался на конкретный</tspan><tspan x="118" dy="27">материал.</tspan></text><rect x="820" y="535" width="690" height="190" rx="28" fill="#EEF4F1" stroke="#D7D0C1" stroke-width="2"/><text x="848" y="585" font-size="27" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="848" dy="0">4. Grounded answer</tspan></text><text x="848" y="627" font-size="21" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="848" dy="0">Сильный ответ связан с найденным</tspan><tspan x="848" dy="27">контекстом, а не просто звучит уверенно и</tspan><tspan x="848" dy="27">красиво.</tspan></text><text x="90" y="792" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Типичная ошибка новичка: думать, что RAG автоматически решает hallucinations без настройки retrieval</tspan><tspan x="90" dy="28">и оценки качества.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l20_rag_system_map</tspan></text></svg>