', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="974" dy="0">нет</tspan></text><rect x="1200" y="556" width="310" height="70" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="1214" y="586" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1214" dy="0">Сильно зависит от вовлечения</tspan><tspan x="1214" dy="22">сильных сотрудников</tspan></text><rect x="90" y="626" width="430" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Weekly review вопросов новичков</tspan></text><rect x="520" y="626" width="220" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="534" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="534" dy="0">да</tspan></text><rect x="740" y="626" width="220" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="754" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="754" dy="0">да</tspan></text><rect x="960" y="626" width="240" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="974" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="974" dy="0">частично</tspan></text><rect x="1200" y="626" width="310" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="1214" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1214" dy="0">Полезно как доп. слой, не</tspan><tspan x="1214" dy="22">как core-решение</tspan></text><text x="90" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="