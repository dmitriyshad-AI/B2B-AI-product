<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#faf1ed" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 17</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Три режима summary из одного</tspan><tspan x="90" dy="56">документа</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Один и тот же текст читается по-разному, если вы заранее знаете, какое решение готовите.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L17-CASE-A</tspan></text><rect x="90" y="290" width="460" height="420" rx="28" fill="#faf1ed" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="114" dy="0">1. Суть</tspan></text><circle cx="124" cy="380" r="5" fill="#C65A1E"/><text x="142" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Цель пилота: сократить время от</tspan><tspan x="142" dy="28">обращения до первого рабочего</tspan><tspan x="142" dy="28">черновика ответа.</tspan></text><circle cx="124" cy="486" r="5" fill="#C65A1E"/><text x="142" y="494" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Участвуют 6 специалистов первой</tspan><tspan x="142" dy="28">линии в течение 2 недель.</tspan></text><circle cx="124" cy="564" r="5" fill="#C65A1E"/><text x="142" y="572" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Тестируют greeting, follow-up и</tspan><tspan x="142" dy="28">режим редактирования сырого</tspan><tspan x="142" dy="28">ответа.</tspan></text><rect x="570" y="290" width="460" height="420" rx="28" fill="#f1f3f2" stroke="#D7D0C1" stroke-width="2"/><text x="594" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="594" dy="0">2. Риски</tspan></text><circle cx="604" cy="380" r="5" fill="#5A7268"/><text x="622" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Сотрудники могут копировать</tspan><tspan x="622" dy="28">слишком длинные и неестественные</tspan><tspan x="622" dy="28">тексты.</tspan></text><circle cx="604" cy="486" r="5" fill="#5A7268"/><text x="622" y="494" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Может потеряться единый тон</tspan><tspan x="622" dy="28">команды.</tspan></text><circle cx="604" cy="564" r="5" fill="#5A7268"/><text x="622" y="572" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Без owner библиотека шаблонов</tspan><tspan x="622" dy="28">быстро устареет.</tspan></text><circle cx="604" cy="642" r="5" fill="#5A7268"/><text x="622" y="650" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Сырые диалоги в публичном AI</tspan><tspan x="622" dy="28">повышают риск утечки.</tspan></text><rect x="1050" y="290" width="460" height="420" rx="28" fill="#F4EEE3" stroke="#D7D0C1" stroke-width="2"/><text x="1074" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#b0521e"><tspan x="1074" dy="0">3. Действия</tspan></text><circle cx="1084" cy="380" r="5" fill="#C65A1E"/><text x="1102" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Назначить owner библиотеки</tspan><tspan x="1102" dy="28">шаблонов.</tspan></text><circle cx="1084" cy="458" r="5" fill="#C65A1E"/><text x="1102" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Зафиксировать разрешенные и</tspan><tspan x="1102" dy="28">запрещенные AI-сценарии.</tspan></text><circle cx="1084" cy="536" r="5" fill="#C65A1E"/><text x="1102" y="544" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Дать короткий стандарт ручной</tspan><tspan x="1102" dy="28">редактуры.</tspan></text><circle cx="1084" cy="614" r="5" fill="#C65A1E"/><text x="1102" y="622" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Определить, кто делает review</tspan><tspan x="1102" dy="28">шаблонов и спорных ответов.</tspan></text><rect x="90" y="735" width="330" height="74" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="110" y="775" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="110" dy="0">Пилот</tspan></text><text x="110" y="813" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="110" dy="0">2 недели и 6 специалистов</tspan><tspan x="110" dy="24">первой линии</tspan></text><rect x="450" y="735" width="330" height="74" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="470" y="775" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="470" dy="0">Цель</tspan></text><text x="470" y="813" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="470" dy="0">быстрее собрать первый рабочий</tspan><tspan x="470" dy="24">ответ клиенту</tspan></text><rect x="810" y="735" width="330" height="74" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="830" y="775" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="830" dy="0">Режим</tspan></text><text x="830" y="813" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="830" dy="0">суть -&gt; риски -&gt; действия</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l17_summary_modes</tspan></text></svg>