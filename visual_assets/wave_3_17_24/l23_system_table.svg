_v1; message_tone_fix_v1</tspan></text><rect x="90" y="498" width="250" height="76" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="528" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Проверка</tspan></text><rect x="340" y="498" width="500" height="76" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="528" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">короткий quality checklist</tspan></text><rect x="840" y="498" width="670" height="76" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="854" y="528" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="854" dy="0">факт; контекст; тон; следующий шаг; лишние обещания</tspan></text><rect x="90" y="574" width="250" height="76" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="604" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="104" dy="0">Безопасность</tspan></text><rect x="340" y="574" width="500" height="76" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="354" y="604" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="354" dy="0">правила, что нельзя отправлять в AI</tspan></text><rect x="840" y="574" width="670" height="76" rx="0" fill="#FCFAF4" stroke="#D7D0C1" stroke-width="1"/><text x="854" y="604" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="854" dy="0">персональные данные; конфиденциальные цифры;</tspan><tspan x="854" dy="22">неанонимизированные договоры</tspan></text><rect x="90" y="650" width="250" height="76" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="104" y="680" font-size="18" font-family="'Trebu