<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#edf1f2" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#faf4f0" stroke="#faf4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 21</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Проверка понимания: что уже понял,</tspan><tspan x="90" dy="56">что еще нет</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Самообучение становится рабочим только тогда, когда AI не просто объясняет, а дает вам</tspan><tspan x="90" dy="32">обратную связь на ответ.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#af652a" stroke="#af652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L21-CASE-A</tspan></text><rect x="90" y="290" width="840" height="470" rx="28" fill="#f1f5f5" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#215B5D"><tspan x="120" dy="0">Пример ответа ученика</tspan></text><circle cx="130" cy="390" r="5" fill="#215B5D"/><text x="148" y="398" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Когорта - это группа пользователей, которые пришли в одно время.</tspan></text><circle cx="130" cy="440" r="5" fill="#215B5D"/><text x="148" y="448" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Когортный анализ показывает, как эта группа ведет себя дальше.</tspan></text><circle cx="130" cy="490" r="5" fill="#215B5D"/><text x="148" y="498" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Обычная сводка по месяцу дает общие числа, но не качество</tspan><tspan x="148" dy="28">удержания конкретной группы.</tspan></text><rect x="970" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#215B5D"><tspan x="990" dy="0">Что понял</tspan></text><text x="990" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">когорта = группа с</tspan><tspan x="990" dy="24">общим стартом; анализ</tspan><tspan x="990" dy="24">= поведение во времени</tspan></text><rect x="1245" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="1265" dy="0">Что неполно</tspan></text><text x="1265" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">когорты нужны не</tspan><tspan x="1265" dy="24">только для retention,</tspan><tspan x="1265" dy="24">но и для повторных</tspan><tspan x="1265" dy="24">покупок и активации</tspan></text><rect x="970" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="990" dy="0">5 вопросов</tspan></text><text x="990" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">используем AI, чтобы</tspan><tspan x="990" dy="24">проверить разницу, а</tspan><tspan x="990" dy="24">не просто перечитать</tspan><tspan x="990" dy="24">определение</tspan></text><rect x="1245" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A4A24"><tspan x="1265" dy="0">Проверить отдельно</tspan></text><text x="1265" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">как компания считает</tspan><tspan x="1265" dy="24">retention, что</tspan><tspan x="1265" dy="24">считается возвратом и</tspan><tspan x="1265" dy="24">на каком интервале</tspan><tspan x="1265" dy="24">сравниваются когорты</tspan></text><text x="90" y="790" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Зрелое самообучение = объяснение + сравнение + проверка себя + список того, что нельзя брать на</tspan><tspan x="90" dy="28">веру.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l21_understanding_check</tspan></text></svg>