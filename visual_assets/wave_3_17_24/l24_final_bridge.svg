<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#ecf0f0" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#faf4f0" stroke="#faf4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#154E47" stroke="#154E47" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 24</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Из уроков 21-23 в рабочий rollout</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Финал Core силен тогда, когда предыдущие уроки собираются в одну систему, а не остаются</tspan><tspan x="90" dy="32">отдельными приемами.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#af652a" stroke="#af652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L24-BRIDGE-A / FW-L24-CASE-A / FW-L24-CASE-B</tspan></text><rect x="90" y="340" width="341" height="240" rx="28" fill="#ecf0f0" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#154E47" stroke="#154E47" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#154E47"><tspan x="114" dy="0">Урок 21</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Learning loop делает новое</tspan><tspan x="114" dy="24">знание рабочим, а не пассивно</tspan><tspan x="114" dy="24">просмотренным.</tspan></text><line x1="431" y1="460" x2="443" y2="460" stroke="#144a44" stroke-width="4"/><polygon points="443,460 429,452 429,468" fill="#144a44"/><rect x="449" y="340" width="341" height="240" rx="28" fill="#f9f3ee" stroke="#D7D0C1" stroke-width="2"/><rect x="469" y="358" width="72" height="36" rx="18" fill="#B86A2B" stroke="#B86A2B" stroke-width="2"/><text x="493" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="493" dy="0">2</tspan></text><text x="473" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="473" dy="0">Урок 22</tspan></text><text x="473" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="473" dy="0">Practical filter отсеивает</tspan><tspan x="473" dy="24">игрушки и оставляет сценарии с</tspan><tspan x="473" dy="24">measurable effect.</tspan></text><line x1="790" y1="460" x2="802" y2="460" stroke="#144a44" stroke-width="4"/><polygon points="802,460 788,452 788,468" fill="#144a44"/><rect x="808" y="340" width="341" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="828" y="358" width="72" height="36" rx="18" fill="#154E47" stroke="#154E47" stroke-width="2"/><text x="852" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="852" dy="0">3</tspan></text><text x="832" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#154E47"><tspan x="832" dy="0">Урок 23</tspan></text><text x="832" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="832" dy="0">Личная система сохраняет</tspan><tspan x="832" dy="24">templates, checklist, safety</tspan><tspan x="832" dy="24">rules и журнал подтверждений.</tspan></text><line x1="1149" y1="460" x2="1161" y2="460" stroke="#144a44" stroke-width="4"/><polygon points="1161,460 1147,452 1147,468" fill="#144a44"/><rect x="1167" y="340" width="341" height="240" rx="28" fill="#EFF4F1" stroke="#D7D0C1" stroke-width="2"/><rect x="1187" y="358" width="72" height="36" rx="18" fill="#B86A2B" stroke="#B86A2B" stroke-width="2"/><text x="1211" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1211" dy="0">4</tspan></text><text x="1191" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="1191" dy="0">Урок 24</tspan></text><text x="1191" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1191" dy="0">Все это становится план внедрения</tspan><tspan x="1191" dy="24">на 14 дней и пакет артефактов результата для</tspan><tspan x="1191" dy="24">команды.</tspan></text><rect x="120" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="140" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#154E47"><tspan x="140" dy="0">Input</tspan></text><text x="140" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="140" dy="0">3 личных сценария + 2 лучших</tspan><tspan x="140" dy="24">шаблона + 1 checklist</tspan></text><rect x="550" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="570" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="570" dy="0">Output</tspan></text><text x="570" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="570" dy="0">14-дневный план + общий сценарий</tspan><tspan x="570" dy="24">+ одна простая метрика</tspan></text><rect x="980" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1000" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1000" dy="0">Финальный смысл</tspan></text><text x="1000" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1000" dy="0">теперь у ученика есть система</tspan><tspan x="1000" dy="24">внедрения, а не просто набор</tspan><tspan x="1000" dy="24">знаний про AI</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#144440" stroke="#144440" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">Формула финала: не 'теперь вы много знаете про AI', а 'теперь у вас есть сценарии, шаблоны, проверка</tspan><tspan x="116" dy="26">и короткий rollout'.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l24_final_bridge</tspan></text></svg>