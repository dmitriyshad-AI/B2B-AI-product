<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#eef3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#2F6B83" stroke="#2F6B83" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 18</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Подготовка к статус-созвону по CRM-</tspan><tspan x="90" dy="56">интеграции</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Хороший prep screen держит вместе контекст, agenda, вопросы и риски, чтобы встреча не</tspan><tspan x="90" dy="32">расползлась.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L18-CASE-A</tspan></text><rect x="90" y="290" width="460" height="470" rx="28" fill="#eef3f5" stroke="#D7D0C1" stroke-width="2"/><text x="114" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2F6B83"><tspan x="114" dy="0">Контекст созвона</tspan></text><circle cx="124" cy="380" r="5" fill="#2F6B83"/><text x="142" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Интеграция уже сдвигается на 8</tspan><tspan x="142" dy="28">рабочих дней.</tspan></text><circle cx="124" cy="458" r="5" fill="#2F6B83"/><text x="142" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">QA нашла 7 критичных дефектов.</tspan></text><circle cx="124" cy="508" r="5" fill="#2F6B83"/><text x="142" y="516" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="142" dy="0">Маркетинг поставил рассылку о</tspan><tspan x="142" dy="28">запуске на следующую неделю.</tspan></text><rect x="570" y="290" width="460" height="470" rx="28" fill="#f1f3f2" stroke="#D7D0C1" stroke-width="2"/><text x="594" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="594" dy="0">Agenda на 30 минут</tspan></text><circle cx="604" cy="380" r="5" fill="#5A7268"/><text x="622" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Подтвердить текущий статус и</tspan><tspan x="622" dy="28">причины сдвига.</tspan></text><circle cx="604" cy="458" r="5" fill="#5A7268"/><text x="622" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Разобрать 7 критичных дефектов и</tspan><tspan x="622" dy="28">влияние на запуск.</tspan></text><circle cx="604" cy="536" r="5" fill="#5A7268"/><text x="622" y="544" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Решить: переносим срок целиком</tspan><tspan x="622" dy="28">или режем scope.</tspan></text><circle cx="604" cy="614" r="5" fill="#5A7268"/><text x="622" y="622" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="622" dy="0">Зафиксировать владельца внешней</tspan><tspan x="622" dy="28">коммуникации и следующий шаг.</tspan></text><rect x="1050" y="290" width="460" height="470" rx="28" fill="#F4EEE3" stroke="#D7D0C1" stroke-width="2"/><text x="1074" y="338" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#2b6177"><tspan x="1074" dy="0">Вопросы и риски</tspan></text><circle cx="1084" cy="380" r="5" fill="#2F6B83"/><text x="1102" y="388" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Какие дефекты блокируют запуск</tspan><tspan x="1102" dy="28">полностью?</tspan></text><circle cx="1084" cy="458" r="5" fill="#2F6B83"/><text x="1102" y="466" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Какой минимальный scope можно</tspan><tspan x="1102" dy="28">выпустить безопасно?</tspan></text><circle cx="1084" cy="536" r="5" fill="#2F6B83"/><text x="1102" y="544" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Кто подтверждает новую дату и</tspan><tspan x="1102" dy="28">кто сообщает о переносе?</tspan></text><circle cx="1084" cy="614" r="5" fill="#2F6B83"/><text x="1102" y="622" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1102" dy="0">Риск: встреча уйдет в детали без</tspan><tspan x="1102" dy="28">решения по сроку.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l18_crm_status_prep</tspan></text></svg>