<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#f0f3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f9f5f0" stroke="#f9f5f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#496A8B" stroke="#496A8B" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 20</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Трехшаговый вход в новую тему</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Зрелое использование AI для исследования начинается с карты темы, а заканчивается списком</tspan><tspan x="90" dy="32">того, что надо проверить отдельно.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#ad7631" stroke="#ad7631" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L20-CASE-A</tspan></text><rect x="90" y="340" width="461" height="240" rx="28" fill="#f0f3f5" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#496A8B" stroke="#496A8B" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#496A8B"><tspan x="114" dy="0">Карта темы</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Что такое RAG, из каких блоков состоит и</tspan><tspan x="114" dy="24">где реально используется.</tspan></text><line x1="551" y1="460" x2="563" y2="460" stroke="#456584" stroke-width="4"/><polygon points="563,460 549,452 549,468" fill="#456584"/><rect x="569" y="340" width="461" height="240" rx="28" fill="#f9f4ee" stroke="#D7D0C1" stroke-width="2"/><rect x="589" y="358" width="72" height="36" rx="18" fill="#B67B32" stroke="#B67B32" stroke-width="2"/><text x="613" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="613" dy="0">2</tspan></text><text x="593" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B67B32"><tspan x="593" dy="0">Ключевые вопросы</tspan></text><text x="593" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="593" dy="0">Retrieval, embeddings, chunking,</tspan><tspan x="593" dy="24">relevance, grounded answer и ошибки</tspan><tspan x="593" dy="24">понимания.</tspan></text><line x1="1030" y1="460" x2="1042" y2="460" stroke="#456584" stroke-width="4"/><polygon points="1042,460 1028,452 1028,468" fill="#456584"/><rect x="1048" y="340" width="461" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="1068" y="358" width="72" height="36" rx="18" fill="#496A8B" stroke="#496A8B" stroke-width="2"/><text x="1092" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1092" dy="0">3</tspan></text><text x="1072" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#496A8B"><tspan x="1072" dy="0">Проверка</tspan></text><text x="1072" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1072" dy="0">Какие факты, цифры и ограничения нельзя</tspan><tspan x="1072" dy="24">брать на веру из красивого объяснения.</tspan></text><rect x="120" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="140" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#496A8B"><tspan x="140" dy="0">Шаг 1</tspan></text><text x="140" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="140" dy="0">AI для ориентации</tspan></text><rect x="550" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="570" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B67B32"><tspan x="570" dy="0">Шаг 2</tspan></text><text x="570" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="570" dy="0">источники для проверки</tspan></text><rect x="980" y="640" width="380" height="118" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1000" y="680" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="1000" dy="0">Шаг 3</tspan></text><text x="1000" y="718" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1000" dy="0">человек для вывода и решения</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#3e5b78" stroke="#3e5b78" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">Не путайте карту темы с самой темой: AI снижает туман на старте, но не закрывает фактчек.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l20_topic_entry_map</tspan></text></svg>