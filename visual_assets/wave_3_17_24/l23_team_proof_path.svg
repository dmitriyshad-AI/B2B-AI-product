<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#eceff2" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f6f4f0" stroke="#f6f4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 23</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Из личной системы в командный</tspan><tspan x="90" dy="56">стандарт</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Финальный блок должен показывать путь в B2B: из личной практики рождается общий сценарий,</tspan><tspan x="90" dy="32">шаблон и owner.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#83652a" stroke="#83652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L23-BRIDGE-A</tspan></text><rect x="90" y="340" width="221" height="240" rx="28" fill="#eceff2" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="114" dy="0">1 общий сценарий</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Берем задачу,</tspan><tspan x="114" dy="24">которая повторяется</tspan><tspan x="114" dy="24">у нескольких людей в</tspan><tspan x="114" dy="24">команде.</tspan></text><line x1="311" y1="460" x2="323" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="323,460 309,452 309,468" fill="#153b5e"/><rect x="329" y="340" width="221" height="240" rx="28" fill="#f5f3ee" stroke="#D7D0C1" stroke-width="2"/><rect x="349" y="358" width="72" height="36" rx="18" fill="#8A6A2B" stroke="#8A6A2B" stroke-width="2"/><text x="373" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="373" dy="0">2</tspan></text><text x="353" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#8A6A2B"><tspan x="353" dy="0">1 общий шаблон</tspan></text><text x="353" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="353" dy="0">Фиксируем prompt или</tspan><tspan x="353" dy="24">template, который</tspan><tspan x="353" dy="24">реально помогает в</tspan><tspan x="353" dy="24">этом сценарии.</tspan></text><line x1="550" y1="460" x2="562" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="562,460 548,452 548,468" fill="#153b5e"/><rect x="568" y="340" width="221" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="588" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="612" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="612" dy="0">3</tspan></text><text x="592" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="592" dy="0">1 чек-лист</tspan></text><text x="592" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="592" dy="0">Определяем, как</tspan><tspan x="592" dy="24">быстро проверить</tspan><tspan x="592" dy="24">качество результата</tspan><tspan x="592" dy="24">перед отправкой.</tspan></text><line x1="789" y1="460" x2="801" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="801,460 787,452 787,468" fill="#153b5e"/><rect x="807" y="340" width="221" height="240" rx="28" fill="#EFF4F1" stroke="#D7D0C1" stroke-width="2"/><rect x="827" y="358" width="72" height="36" rx="18" fill="#8A6A2B" stroke="#8A6A2B" stroke-width="2"/><text x="851" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="851" dy="0">4</tspan></text><text x="831" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#8A6A2B"><tspan x="831" dy="0">1 owner</tspan></text><text x="831" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="831" dy="0">Нужен человек,</tspan><tspan x="831" dy="24">который отвечает за</tspan><tspan x="831" dy="24">шаблон, review и</tspan><tspan x="831" dy="24">обновления.</tspan></text><line x1="1028" y1="460" x2="1040" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="1040,460 1026,452 1026,468" fill="#153b5e"/><rect x="1046" y="340" width="221" height="240" rx="28" fill="#F5F1FA" stroke="#D7D0C1" stroke-width="2"/><rect x="1066" y="358" width="72" height="36" rx="18" fill="#163E62" stroke="#163E62" stroke-width="2"/><text x="1090" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1090" dy="0">5</tspan></text><text x="1070" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#163E62"><tspan x="1070" dy="0">2-3 proof examples</tspan></text><text x="1070" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1070" dy="0">Собираем реальные</tspan><tspan x="1070" dy="24">примеры</tspan><tspan x="1070" dy="24">использования, а не</tspan><tspan x="1070" dy="24">обещания будущей</tspan><tspan x="1070" dy="24">пользы.</tspan></text><line x1="1267" y1="460" x2="1279" y2="460" stroke="#153b5e" stroke-width="4"/><polygon points="1279,460 1265,452 1265,468" fill="#153b5e"/><rect x="1285" y="340" width="221" height="240" rx="28" fill="#F1F4F8" stroke="#D7D0C1" stroke-width="2"/><rect x="1305" y="358" width="72" height="36" rx="18" fill="#8A6A2B" stroke="#8A6A2B" stroke-width="2"/><text x="1329" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1329" dy="0">6</tspan></text><text x="1309" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#8A6A2B"><tspan x="1309" dy="0">1 team metric</tspan></text><text x="1309" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1309" dy="0">Выбираем простую</tspan><tspan x="1309" dy="24">метрику поведения</tspan><tspan x="1309" dy="24">или экономии</tspan><tspan x="1309" dy="24">времени.</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#143756" stroke="#143756" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">Так личная система перестает быть личным лайфхаком и становится основой командного стандарта.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l23_team_proof_path</tspan></text></svg>