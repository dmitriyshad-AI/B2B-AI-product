<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#faf1ed" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#C65A1E" stroke="#C65A1E" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 17</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Quality gate для любого AI-summary</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Summary от AI - это рабочая версия извлечения смысла, а не окончательная истина.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L17-CASE-A</tspan></text><rect x="90" y="290" width="680" height="450" rx="28" fill="#fbf3ef" stroke="#D7D0C1" stroke-width="2"/><rect x="830" y="290" width="680" height="450" rx="28" fill="#f3f5f4" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#C65A1E"><tspan x="120" dy="0">Что проверяем руками</tspan></text><text x="860" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="860" dy="0">Красные флаги слабого summary</tspan></text><circle cx="130" cy="387" r="5" fill="#C65A1E"/><text x="148" y="395" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Не придумал ли AI факт, которого в записке не</tspan><tspan x="148" dy="28">было.</tspan></text><circle cx="130" cy="465" r="5" fill="#C65A1E"/><text x="148" y="473" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Не исчез ли критичный нюанс: ограничения, сроки,</tspan><tspan x="148" dy="28">ответственность.</tspan></text><circle cx="130" cy="543" r="5" fill="#C65A1E"/><text x="148" y="551" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Не превратился ли спорный пункт в уверенный вывод.</tspan></text><circle cx="870" cy="387" r="5" fill="#5A7268"/><text x="888" y="395" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="888" dy="0">Пропали ограничения по данным и ручной проверке.</tspan></text><circle cx="870" cy="437" r="5" fill="#5A7268"/><text x="888" y="445" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="888" dy="0">Owner шаблонов не назван, хотя это ключевой риск</tspan><tspan x="888" dy="28">пилота.</tspan></text><circle cx="870" cy="515" r="5" fill="#5A7268"/><text x="888" y="523" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="888" dy="0">Проблема тона подана как уже решенная.</tspan></text><circle cx="870" cy="565" r="5" fill="#5A7268"/><text x="888" y="573" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="888" dy="0">Управленческий вопрос масштабирования спрятан за</tspan><tspan x="888" dy="28">гладким языком.</tspan></text><rect x="90" y="760" width="1420" height="50" rx="24" fill="#9d4b1f" stroke="#9d4b1f" stroke-width="2"/><text x="120" y="794" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="120" dy="0">Чем ближе документ к срокам, деньгам и обязательствам, тем обязательнее ручная проверка summary.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l17_summary_quality_gate</tspan></text></svg>