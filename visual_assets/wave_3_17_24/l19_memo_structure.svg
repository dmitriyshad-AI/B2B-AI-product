<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#f9f1ee" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#f3f5f4" stroke="#f3f5f4" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#B85B34" stroke="#B85B34" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 19</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Структура записки на 1 страницу</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">После отбора AI должен помочь собрать не красивый текст, а управленческий каркас решения.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#566d64" stroke="#566d64" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L19-CASE-A</tspan></text><rect x="90" y="290" width="840" height="470" rx="28" fill="#faf5f2" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B85B34"><tspan x="120" dy="0">Что должно войти в записку</tspan></text><circle cx="130" cy="390" r="5" fill="#B85B34"/><text x="148" y="398" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Проблема: долгий вход в работу и хаос в знаниях.</tspan></text><circle cx="130" cy="440" r="5" fill="#B85B34"/><text x="148" y="448" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Решение: стартовая база знаний + шаблоны типовых задач.</tspan></text><circle cx="130" cy="490" r="5" fill="#B85B34"/><text x="148" y="498" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Почему реалистично: часть материалов уже существует, запуск</tspan><tspan x="148" dy="28">быстрый.</tspan></text><rect x="970" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B85B34"><tspan x="990" dy="0">Первые 30 дней</tspan></text><text x="990" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">собрать top-20</tspan><tspan x="990" dy="24">вопросов, 10 шаблонов</tspan><tspan x="990" dy="24">и протестировать на</tspan><tspan x="990" dy="24">1-2 новичках</tspan></text><rect x="1245" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5A7268"><tspan x="1265" dy="0">Owner</tspan></text><text x="1265" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">руководитель</tspan><tspan x="1265" dy="24">операционной команды</tspan><tspan x="1265" dy="24">или куратор адаптации</tspan></text><rect x="970" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="990" dy="0">Метрики</tspan></text><text x="990" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">время до</tspan><tspan x="990" dy="24">самостоятельной</tspan><tspan x="990" dy="24">задачи, число</tspan><tspan x="990" dy="24">повторяющихся</tspan><tspan x="990" dy="24">вопросов, reusable</tspan><tspan x="990" dy="24">templates</tspan></text><rect x="1245" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#7A4B2A"><tspan x="1265" dy="0">Правило</tspan></text><text x="1265" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">не просим final text с</tspan><tspan x="1265" dy="24">нуля - сначала</tspan><tspan x="1265" dy="24">структура, потом draft</tspan></text><text x="90" y="790" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Перед первым черновиком отдельно фиксируем аудиторию, цель документа и критерии отбора.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l19_memo_structure</tspan></text></svg>