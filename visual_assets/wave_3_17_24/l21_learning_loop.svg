<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#edf1f2" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#faf4f0" stroke="#faf4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 21</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">Learning loop: как учиться через</tspan><tspan x="90" dy="56">диалог с AI</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Хорошее обучение активно: вы не только слушаете объяснение, но и проверяете себя на</tspan><tspan x="90" dy="32">понимание.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#af652a" stroke="#af652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">L21-CASE-A</tspan></text><rect x="90" y="340" width="269" height="240" rx="28" fill="#edf1f2" stroke="#D7D0C1" stroke-width="2"/><rect x="110" y="358" width="72" height="36" rx="18" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="134" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="134" dy="0">1</tspan></text><text x="114" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#215B5D"><tspan x="114" dy="0">Объясни</tspan></text><text x="114" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="114" dy="0">Когортный анализ</tspan><tspan x="114" dy="24">простыми словами для PM,</tspan><tspan x="114" dy="24">без академического</tspan><tspan x="114" dy="24">языка.</tspan></text><line x1="359" y1="460" x2="371" y2="460" stroke="#1f5659" stroke-width="4"/><polygon points="371,460 357,452 357,468" fill="#1f5659"/><rect x="377" y="340" width="269" height="240" rx="28" fill="#f9f3ee" stroke="#D7D0C1" stroke-width="2"/><rect x="397" y="358" width="72" height="36" rx="18" fill="#B86A2B" stroke="#B86A2B" stroke-width="2"/><text x="421" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="421" dy="0">2</tspan></text><text x="401" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="401" dy="0">Сравни</tspan></text><text x="401" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="401" dy="0">Против обычной</tspan><tspan x="401" dy="24">помесячной статистики по</tspan><tspan x="401" dy="24">одному набору вопросов.</tspan></text><line x1="646" y1="460" x2="658" y2="460" stroke="#1f5659" stroke-width="4"/><polygon points="658,460 644,452 644,468" fill="#1f5659"/><rect x="664" y="340" width="269" height="240" rx="28" fill="#F2EEE6" stroke="#D7D0C1" stroke-width="2"/><rect x="684" y="358" width="72" height="36" rx="18" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="708" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="708" dy="0">3</tspan></text><text x="688" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#215B5D"><tspan x="688" dy="0">Спроси</tspan></text><text x="688" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="688" dy="0">5 коротких вопросов,</tspan><tspan x="688" dy="24">которые проверяют</tspan><tspan x="688" dy="24">реальное понимание, а не</tspan><tspan x="688" dy="24">узнавание слов.</tspan></text><line x1="933" y1="460" x2="945" y2="460" stroke="#1f5659" stroke-width="4"/><polygon points="945,460 931,452 931,468" fill="#1f5659"/><rect x="951" y="340" width="269" height="240" rx="28" fill="#EFF4F1" stroke="#D7D0C1" stroke-width="2"/><rect x="971" y="358" width="72" height="36" rx="18" fill="#B86A2B" stroke="#B86A2B" stroke-width="2"/><text x="995" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="995" dy="0">4</tspan></text><text x="975" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="975" dy="0">Проверь</tspan></text><text x="975" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="975" dy="0">Что я понял верно, что</tspan><tspan x="975" dy="24">понял неполно и где еще</tspan><tspan x="975" dy="24">путаюсь.</tspan></text><line x1="1220" y1="460" x2="1232" y2="460" stroke="#1f5659" stroke-width="4"/><polygon points="1232,460 1218,452 1218,468" fill="#1f5659"/><rect x="1238" y="340" width="269" height="240" rx="28" fill="#F5F1FA" stroke="#D7D0C1" stroke-width="2"/><rect x="1258" y="358" width="72" height="36" rx="18" fill="#215B5D" stroke="#215B5D" stroke-width="2"/><text x="1282" y="376" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1282" dy="0">5</tspan></text><text x="1262" y="426" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#215B5D"><tspan x="1262" dy="0">Проверь снаружи</tspan></text><text x="1262" y="466" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1262" dy="0">Что нельзя принимать на</tspan><tspan x="1262" dy="24">веру и нужно сверить с</tspan><tspan x="1262" dy="24">надежными источниками.</tspan></text><rect x="90" y="774" width="1420" height="36" rx="18" fill="#1d4e52" stroke="#1d4e52" stroke-width="2"/><text x="116" y="799" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="116" dy="0">Explanation mode полезен для обучения. Truth mode все равно требует внешней проверки.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l21_learning_loop</tspan></text></svg>