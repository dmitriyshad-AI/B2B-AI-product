<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="60" y="40" width="1480" height="210" rx="40" fill="#ecf0f0" stroke="#D7D0C1" stroke-width="2"/><rect x="60" y="40" width="1480" height="18" rx="40" fill="#faf4f0" stroke="#faf4f0" stroke-width="2"/><rect x="90" y="70" width="190" height="48" rx="24" fill="#154E47" stroke="#154E47" stroke-width="2"/><text x="114" y="100" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="114" dy="0">Урок 24</tspan></text><text x="90" y="158" font-size="50" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="90" dy="0">B2B mini-rollout: что показать ЛПР</tspan><tspan x="90" dy="56">через 14 дней</tspan></text><text x="90" y="220" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Сильный корпоративный финал выглядит как пакет артефактов результата: общий сценарий, owner, 3 примера и</tspan><tspan x="90" dy="32">одна простая метрика.</tspan></text><rect x="1230" y="182" width="280" height="44" rx="22" fill="#af652a" stroke="#af652a" stroke-width="2"/><text x="1254" y="208" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="1254" dy="0">FW-L24-CASE-B</tspan></text><rect x="90" y="290" width="840" height="470" rx="28" fill="#f0f4f3" stroke="#D7D0C1" stroke-width="2"/><text x="120" y="342" font-size="30" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#154E47"><tspan x="120" dy="0">Mini-rollout artifact</tspan></text><circle cx="130" cy="390" r="5" fill="#154E47"/><text x="148" y="398" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Shared scenario: follow-up после клиентских созвонов.</tspan></text><circle cx="130" cy="440" r="5" fill="#154E47"/><text x="148" y="448" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Owner: team lead клиентского направления.</tspan></text><circle cx="130" cy="490" r="5" fill="#154E47"/><text x="148" y="498" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Участники: 5 аккаунт-менеджеров.</tspan></text><circle cx="130" cy="540" r="5" fill="#154E47"/><text x="148" y="548" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="148" dy="0">Review date: через 14 дней после старта.</tspan></text><rect x="970" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#154E47"><tspan x="990" dy="0">Метрика 1</tspan></text><text x="990" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">доля follow-up писем,</tspan><tspan x="990" dy="24">отправленных в течение</tspan><tspan x="990" dy="24">30 минут после встречи</tspan></text><rect x="1245" y="290" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="330" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#B86A2B"><tspan x="1265" dy="0">Метрика 2</tspan></text><text x="1265" y="368" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">среднее время на</tspan><tspan x="1265" dy="24">подготовку первого</tspan><tspan x="1265" dy="24">черновика письма</tspan></text><rect x="970" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="990" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="990" dy="0">Метрика 3</tspan></text><text x="990" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="990" dy="0">число писем, где</tspan><tspan x="990" dy="24">менеджер использовал</tspan><tspan x="990" dy="24">общий шаблон</tspan></text><rect x="1245" y="525" width="245" height="200" rx="28" fill="white" stroke="#D7D0C1" stroke-width="2"/><text x="1265" y="565" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#6A4A24"><tspan x="1265" dy="0">Expected proof</tspan></text><text x="1265" y="603" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1265" dy="0">1 template + 3 real</tspan><tspan x="1265" dy="24">examples + short team</tspan><tspan x="1265" dy="24">lead report</tspan></text><text x="90" y="790" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Финал взрослого курса должен закрываться не словами про вдохновение, а формой доказательства</tspan><tspan x="90" dy="28">внедрения.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l24_b2b_rollout_dashboard</tspan></text></svg>