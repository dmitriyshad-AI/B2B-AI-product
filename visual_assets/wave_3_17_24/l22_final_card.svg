<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#F6F1E8"/><rect x="90" y="90" width="1420" height="700" rx="42" fill="#f1eae8" stroke="#D7D0C1" stroke-width="2"/><rect x="120" y="120" width="1360" height="560" rx="36" fill="white" stroke="#D7D0C1" stroke-width="2"/><rect x="140" y="140" width="210" height="50" rx="25" fill="#A04428" stroke="#A04428" stroke-width="2"/><text x="164" y="172" font-size="24" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="white"><tspan x="164" dy="0">После урока</tspan></text><text x="140" y="285" font-size="60" font-family="Georgia, serif" font-weight="700" fill="#10213B"><tspan x="140" dy="0">После урока: выберите 3</tspan><tspan x="140" dy="68">сценария с понятной пользой</tspan></text><text x="140" y="390" font-size="28" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Сильный результат урока - shortlist сценариев, где AI даст</tspan><tspan x="140" dy="36">measurable effect, а не просто интересный опыт.</tspan></text><rect x="140" y="470" width="1320" height="150" rx="28" fill="#eef3f1" stroke="#D7D0C1" stroke-width="2"/><text x="175" y="530" font-size="34" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#10213B"><tspan x="175" dy="0">Выберите три сценария, где AI не развлекает, а</tspan><tspan x="175" dy="42">дает измеримую экономию времени или снижение</tspan><tspan x="175" dy="42">трения.</tspan></text><text x="140" y="725" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="140" dy="0">Если у сценария нет повторяемости и понятного результата, он пока не заслуживает rollout.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l22_final_card</tspan></text></svg>