span x="784" dy="0">пятница, 15:00</tspan></text><rect x="990" y="626" width="520" height="70" rx="0" fill="white" stroke="#D7D0C1" stroke-width="1"/><text x="1004" y="656" font-size="18" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#10213B"><tspan x="1004" dy="0">новая точка контроля после переноса</tspan></text><text x="90" y="808" font-size="22" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Перед отправкой follow-up вручную проверяем: решение не потерялось, owner не перепутан, срок понятен</tspan><tspan x="90" dy="28">всем.</tspan></text><line x1="90" y1="824" x2="1510" y2="824" stroke="#D7D0C1" stroke-width="2"/><text x="90" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="400" fill="#5F6B7A"><tspan x="90" dy="0">Wave 3 пакет визуальных материалов · Lessons 17-24</tspan></text><text x="1150" y="858" font-size="20" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-weight="700" fill="#5F6B7A"><tspan x="1150" dy="0">l18_follow_up_actions</tspan></text></svg>