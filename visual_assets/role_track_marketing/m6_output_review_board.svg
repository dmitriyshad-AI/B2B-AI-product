<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #8A5A14; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#FFF8F1"/>
  <text class="h" x="120" y="110">Weekly review маркетингового output</text>
  <text class="sub" x="120" y="150">Видно, что выпущено, что тормозит и что надо делать на неделе.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#EBD9C3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#F8E8D4"/>
  <text class="th" x="162" y="288">Что выпущено</text>
  <text class="th" x="430" y="288">Что в работе</text>
  <text class="th" x="670" y="288">Что застряло</text>
  <text class="th" x="940" y="288">Bottleneck</text>
  <text class="th" x="1160" y="288">Решение недели</text>
  <text class="th" x="1360" y="288">Владелец</text>
  <line x1="271" y1="250" x2="271" y2="710" stroke="#EBD9C3"/>
  <line x1="525" y1="250" x2="525" y2="710" stroke="#EBD9C3"/>
  <line x1="780" y1="250" x2="780" y2="710" stroke="#EBD9C3"/>
  <line x1="1025" y1="250" x2="1025" y2="710" stroke="#EBD9C3"/>
  <line x1="1235" y1="250" x2="1235" y2="710" stroke="#EBD9C3"/>
  <text class="td" x="162" y="370">Какие активы завершены</text>
  <text class="td" x="430" y="370">Что еще собираем</text>
  <text class="td" x="670" y="370">Где нет движения</text>
  <text class="td" x="940" y="370">Что ограничивает output</text>
  <text class="td" x="1160" y="370">Что меняем сейчас</text>
  <text class="td" x="1360" y="370">Кто отвечает</text>
</svg>
