<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #8A5A14; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#FFF8F1"/>
  <text class="h" x="120" y="110">Карта сообщения по сегменту</text>
  <text class="sub" x="120" y="150">Связываем сегмент, боль, ценность, доказательство, возражение и CTA.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#EBD9C3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#F8E8D4"/>
  <text class="th" x="162" y="288">Кто</text>
  <text class="th" x="340" y="288">Боль</text>
  <text class="th" x="560" y="288">Ценность</text>
  <text class="th" x="810" y="288">Доказательство</text>
  <text class="th" x="1070" y="288">Возражение</text>
  <text class="th" x="1320" y="288">CTA</text>
  <line x1="226" y1="250" x2="226" y2="710" stroke="#EBD9C3"/>
  <line x1="425" y1="250" x2="425" y2="710" stroke="#EBD9C3"/>
  <line x1="660" y1="250" x2="660" y2="710" stroke="#EBD9C3"/>
  <line x1="915" y1="250" x2="915" y2="710" stroke="#EBD9C3"/>
  <line x1="1170" y1="250" x2="1170" y2="710" stroke="#EBD9C3"/>
  <text class="td" x="162" y="370">Какой сегмент берем</text>
  <text class="td" x="340" y="370">Что у него болит</text>
  <text class="td" x="560" y="370">Что обещаем</text>
  <text class="td" x="810" y="370">Чем подтверждаем</text>
  <text class="td" x="1070" y="370">Что мешает поверить</text>
  <text class="td" x="1320" y="370">Какой шаг нужен</text>
</svg>
