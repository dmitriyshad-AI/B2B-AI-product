<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #8A5A14; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#FFF8F1"/>
  <text class="h" x="120" y="110">Матрица переработки одного исходника</text>
  <text class="sub" x="120" y="150">Одна главная мысль должна работать в нескольких каналах без распада логики.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#EBD9C3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#F8E8D4"/>
  <text class="th" x="162" y="288">Исходник</text>
  <text class="th" x="410" y="288">Главная мысль</text>
  <text class="th" x="670" y="288">Канал 1</text>
  <text class="th" x="900" y="288">Канал 2</text>
  <text class="th" x="1130" y="288">Канал 3</text>
  <text class="th" x="1340" y="288">Проверка</text>
  <line x1="261" y1="250" x2="261" y2="710" stroke="#EBD9C3"/>
  <line x1="515" y1="250" x2="515" y2="710" stroke="#EBD9C3"/>
  <line x1="760" y1="250" x2="760" y2="710" stroke="#EBD9C3"/>
  <line x1="990" y1="250" x2="990" y2="710" stroke="#EBD9C3"/>
  <line x1="1210" y1="250" x2="1210" y2="710" stroke="#EBD9C3"/>
  <text class="td" x="162" y="370">Что берем за основу</text>
  <text class="td" x="410" y="370">Что нельзя потерять</text>
  <text class="td" x="670" y="370">Как адаптируем в email</text>
  <text class="td" x="900" y="370">Как адаптируем в пост</text>
  <text class="td" x="1130" y="370">Как адаптируем в лендинг</text>
  <text class="td" x="1340" y="370">Что проверяем перед выпуском</text>
</svg>
