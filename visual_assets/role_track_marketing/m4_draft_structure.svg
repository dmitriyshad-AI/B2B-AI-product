<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5E6974; }
    .th { font-size: 19px; font-weight: 700; fill: #8A5A14; }
    .td { font-size: 18px; fill: #43505B; }
  </style>
  <rect width="1600" height="900" fill="#FFF8F1"/>
  <text class="h" x="120" y="110">Структура маркетингового черновика</text>
  <text class="sub" x="120" y="150">Собираем текст так, чтобы в нем было меньше воды и больше действия.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#EBD9C3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="60" fill="#F8E8D4"/>
  <text class="th" x="162" y="288">Контекст</text>
  <text class="th" x="390" y="288">Для кого</text>
  <text class="th" x="600" y="288">Обещание</text>
  <text class="th" x="860" y="288">Доказательство</text>
  <text class="th" x="1120" y="288">Ограничение</text>
  <text class="th" x="1340" y="288">CTA</text>
  <line x1="251" y1="250" x2="251" y2="710" stroke="#EBD9C3"/>
  <line x1="470" y1="250" x2="470" y2="710" stroke="#EBD9C3"/>
  <line x1="705" y1="250" x2="705" y2="710" stroke="#EBD9C3"/>
  <line x1="965" y1="250" x2="965" y2="710" stroke="#EBD9C3"/>
  <line x1="1205" y1="250" x2="1205" y2="710" stroke="#EBD9C3"/>
  <text class="td" x="162" y="370">Откуда этот запрос</text>
  <text class="td" x="390" y="370">Какой сегмент читают</text>
  <text class="td" x="600" y="370">Что реально обещаем</text>
  <text class="td" x="860" y="370">Чем подкрепляем</text>
  <text class="td" x="1120" y="370">Что важно оговорить</text>
  <text class="td" x="1340" y="370">Какой шаг нужен</text>
</svg>
