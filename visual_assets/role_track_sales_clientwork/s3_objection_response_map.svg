<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #2A1B1C; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #746163; }
    .th { font-size: 18px; font-weight: 700; fill: #8E2F3C; }
    .td { font-size: 17px; fill: #4F4144; }
  </style>
  <rect width="1600" height="900" fill="#FFF6F6"/>
  <text class="h" x="120" y="110">Карта ответа на возражение</text>
  <text class="sub" x="120" y="150">От причины возражения к следующему шагу, а не к спору.</text>
  <rect x="120" y="220" width="1360" height="500" rx="24" fill="#FFFFFF" stroke="#F0D0D3" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="56" fill="#FCE9EC"/>
  <text class="th" x="164" y="286">Возражение</text>
  <text class="th" x="398" y="286">Что реально за ним стоит</text>
  <text class="th" x="706" y="286">Что уточнить</text>
  <text class="th" x="950" y="286">Как ответить</text>
  <text class="th" x="1190" y="286">Следующий шаг</text>
</svg>
