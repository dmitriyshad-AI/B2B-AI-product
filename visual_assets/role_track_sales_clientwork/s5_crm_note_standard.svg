<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #182233; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5B6675; }
    .panelt { font-size: 22px; font-weight: 700; fill: #2D5B87; }
    .body { font-size: 19px; fill: #425062; }
  </style>
  <rect width="1600" height="900" fill="#F4F8FD"/>
  <text class="h" x="120" y="110">Единый стандарт CRM-заметки</text>
  <text class="sub" x="120" y="150">За 30 секунд должно быть понятно, что происходит со сделкой.</text>
  <rect x="120" y="220" width="1360" height="520" rx="28" fill="#FFFFFF" stroke="#D2E0F0" stroke-width="2"/>
  <text class="panelt" x="170" y="300">Стадия</text>
  <text class="panelt" x="390" y="300">Контекст</text>
  <text class="panelt" x="640" y="300">Сигнал клиента</text>
  <text class="panelt" x="930" y="300">Риск</text>
  <text class="panelt" x="1120" y="300">Следующий шаг</text>
  <text class="panelt" x="1340" y="300">Дата</text>
  <text class="body" x="170" y="400">Какая стадия сделки</text>
  <text class="body" x="390" y="400">Что изменилось</text>
  <text class="body" x="640" y="400">Что важно клиенту</text>
  <text class="body" x="930" y="400">Что тормозит</text>
  <text class="body" x="1120" y="400">Что делаем дальше</text>
  <text class="body" x="1340" y="400">Когда возвращаемся</text>
</svg>
