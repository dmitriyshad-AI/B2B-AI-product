<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #16202A; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #5B6873; }
    .th { font-size: 19px; font-weight: 700; fill: #275F59; }
    .td { font-size: 18px; fill: #3D4B55; }
  </style>
  <rect width="1600" height="900" fill="#F4FBFA"/>
  <text class="h" x="120" y="110">Канва подготовки к диагностической встрече</text>
  <text class="sub" x="120" y="150">Контекст, цель, гипотезы, вопросы, риск и следующий шаг на одном экране.</text>
  <rect x="120" y="220" width="1360" height="520" rx="24" fill="#FFFFFF" stroke="#CFE3DD" stroke-width="2"/>
  <g>
    <rect x="140" y="250" width="1320" height="60" fill="#E7F4F1"/>
    <text class="th" x="162" y="288">Контекст клиента</text>
    <text class="th" x="375" y="288">Цель звонка</text>
    <text class="th" x="570" y="288">Гипотезы</text>
    <text class="th" x="760" y="288">Вопросы</text>
    <text class="th" x="940" y="288">Риск</text>
    <text class="th" x="1128" y="288">Следующий шаг</text>
    <line x1="340" y1="250" x2="340" y2="710" stroke="#D7E7E3"/>
    <line x1="540" y1="250" x2="540" y2="710" stroke="#D7E7E3"/>
    <line x1="730" y1="250" x2="730" y2="710" stroke="#D7E7E3"/>
    <line x1="910" y1="250" x2="910" y2="710" stroke="#D7E7E3"/>
    <line x1="1100" y1="250" x2="1100" y2="710" stroke="#D7E7E3"/>
    <text class="td" x="162" y="370">Что уже знаем о клиенте</text>
    <text class="td" x="375" y="370">Какой результат нужен</text>
    <text class="td" x="570" y="370">Что может болеть</text>
    <text class="td" x="760" y="370">Что надо уточнить</text>
    <text class="td" x="940" y="370">Где разговор застрянет</text>
    <text class="td" x="1128" y="370">Что фиксируем после звонка</text>
  </g>
</svg>
