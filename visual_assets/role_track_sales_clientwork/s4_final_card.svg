<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #182224; }
    .h { font-size: 44px; font-weight: 700; }
    .sub { font-size: 24px; fill: #5E6B6C; }
  </style>
  <rect width="1600" height="900" fill="#F8FBF2"/>
  <text class="h" x="120" y="270">Сразу после урока</text>
  <text class="sub" x="120" y="340">Пересоберите одно реальное КП по новой структуре и уберите лишний шум.</text>
  <text class="sub" x="120" y="390">Первый черновик должен ускорять сделку, а не создавать новый цикл правок.</text>
</svg>
