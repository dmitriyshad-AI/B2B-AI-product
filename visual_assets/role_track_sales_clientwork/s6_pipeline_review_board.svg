<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <style>
    text { font-family: "IBM Plex Sans", "Arial", sans-serif; fill: #231F17; }
    .h { font-size: 40px; font-weight: 700; }
    .sub { font-size: 22px; fill: #6A665F; }
    .th { font-size: 18px; font-weight: 700; fill: #7C5D12; }
  </style>
  <rect width="1600" height="900" fill="#FFFBEF"/>
  <text class="h" x="120" y="110">Обзор воронки на одной странице</text>
  <text class="sub" x="120" y="150">Видно, что движется, что стоит и где нужен разбор.</text>
  <rect x="120" y="220" width="1360" height="500" rx="24" fill="#FFFFFF" stroke="#E8DEBE" stroke-width="2"/>
  <rect x="140" y="250" width="1320" height="56" fill="#FBF3D9"/>
  <text class="th" x="164" y="286">Сделка</text>
  <text class="th" x="360" y="286">Что движется</text>
  <text class="th" x="620" y="286">Что стоит</text>
  <text class="th" x="860" y="286">Риск</text>
  <text class="th" x="1050" y="286">Действие на неделе</text>
  <text class="th" x="1310" y="286">Разбор</text>
</svg>
